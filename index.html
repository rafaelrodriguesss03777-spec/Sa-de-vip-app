<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP & Grátis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
  margin:0;
  font-family: Arial,sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.card{
  background:#151515;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 0 20px rgba(255,255,255,0.05);
  transition: all 0.3s;
}
h2,h3{margin:0 0 10px;}
select,button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button{
  font-weight:bold;
  cursor:pointer;
  transition: all 0.3s;
}
button:hover{transform:scale(1.05);}
button.sec{background:#333;color:#fff}

/* BOTÃO GRÁTIS VERDE */
.buttonFree{
  background:linear-gradient(90deg,#00ff00,#00cc00);
  color:#000;
  box-shadow:0 0 15px #00ff00;
  border:2px solid #00ff00;
  transition: all 0.3s;
}
.buttonFree:hover{box-shadow:0 0 30px #00ff00;}

/* BOTÃO VIP DOURADO */
.buttonVIP{
  background:linear-gradient(90deg,#FFD700,#FFEA00);
  color:#000;
  box-shadow:0 0 15px gold;
  border:2px solid gold;
}
.buttonVIP:hover{box-shadow:0 0 30px gold;}

/* VIP CARD */
.vip{border:3px solid gold;animation:pulse 2s infinite;}
@keyframes pulse{
  0%,100%{box-shadow:0 0 10px gold;}
  50%{box-shadow:0 0 25px gold;}
}

.box{
  background:#1f1f1f;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  border:1px solid #555;
}
.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}
.progress span{display:block;height:100%;background:gold;transition:width 0.5s;}
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.day{
  background:#000;
  color:#fff;
  border-radius:8px;
  text-align:center;
  padding:10px 0;
  font-size:12px;
}
.day.done{color:#0f0;background:#0a0;font-weight:bold;}
.period{margin-bottom:8px}
.period b{color:gold;}
.nav{display:flex;gap:10px;margin-bottom:16px;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="container">

<!-- NAVEGAÇÃO -->
<div class="nav">
<button class="buttonFree" onclick="showPage('free')">🆓 Plano Grátis</button>
<button class="buttonVIP" onclick="showPage('vip')">⭐ VIP</button>
</div>

<!-- ESCOLHER META -->
<div class="card">
<h2>🎯 Escolha sua meta</h2>
<select id="goal">
<option value="">Selecione</option>
<option value="emagrecer">Emagrecer</option>
<option value="ganhar">Ganhar massa</option>
<option value="definir">Definir corpo</option>
</select>
</div>

<!-- PLANO GRÁTIS -->
<div id="pageFree" class="card">
<h2>🆓 Plano Grátis</h2>
<div class="box">
<h3>🥗 Alimentação do Dia</h3>
<div id="foodFree"></div>
</div>
<div class="box">
<h3>🔥 Treino do Dia</h3>
<div id="workoutFree"></div>
</div>
</div>

<!-- PLANO VIP -->
<div id="pageVIP" class="card hidden">
<h2>⭐ VIP</h2>
<p>Dia <b id="dayCount">1</b>/30</p>
<div class="progress"><span id="bar"></span></div>

<div id="vipContent" class="hidden">
<div class="box">
<h3>🥗 Alimentação VIP do Dia</h3>
<div id="foodVIP"></div>
</div>
<div class="box">
<h3>🔥 Treino VIP do Dia</h3>
<div id="workoutVIP"></div>
</div>

<button id="finishBtn" class="buttonVIP">✅ Concluir treino do dia</button>
<button id="resetBtn" class="buttonVIP" style="margin-top:10px;">🔄 Reiniciar 30 dias</button>

<h3 style="margin-top:16px;">📅 Progresso</h3>
<div class="grid" id="calendar"></div>
<h3 style="margin-top:20px;">📊 Gráfico</h3>
<canvas id="chart"></canvas>
</div>

<button id="unlockBtn" class="buttonVIP" onclick="unlockVIP()">🔓 Desbloquear VIP</button>
</div>

</div>

<script>
// NAVEGAÇÃO
function showPage(p){
document.getElementById("pageFree").style.display=p==="free"?"block":"none";
document.getElementById("pageVIP").style.display=p==="vip"?"block":"none";
}

};
