<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Saúde e Metas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
    }
    h2 {
      text-align: center;
      color: green;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    .resultado {
      margin-top: 20px;
      background: #e8ffe8;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Saúde e Metas</h2>

  <label>Peso atual (kg)</label>
  <input type="number" id="pesoAtual">

  <label>Altura (cm)</label>
  <input type="number" id="altura">

  <label>Peso desejado (kg)</label>
  <input type="number" id="pesoDesejado">

  <button onclick="calcular()">Ver sugestão</button>

  <div class="resultado" id="resultado"></div>
</div>

<script>
  function calcular() {
    const peso = parseFloat(document.getElementById("pesoAtual").value);
    const alturaCm = parseFloat(document.getElementById("altura").value);
    const pesoDesejado = parseFloat(document.getElementById("pesoDesejado").value);

    if (!peso || !alturaCm || !pesoDesejado) {
      document.getElementById("resultado").innerHTML =
        "⚠️ Preencha todos os campos.";
      return;
    }

    const altura = alturaCm / 100;
    const imc = peso / (altura * altura);
    let exercicios = "";
    let alimentacao = "";

    if (peso > pesoDesejado) {
      exercicios = "🚶 Caminhada, corrida leve, agachamentos e bicicleta.";
      alimentacao = "🥗 Comer mais legumes, frutas e reduzir açúcar.";
    } else {
      exercicios = "🏋️ Exercícios de força e resistência.";
      alimentacao = "🍗 Aumentar proteínas e refeições equilibradas.";
    }

    document.getElementById("resultado").innerHTML = `
      <b>IMC:</b> ${imc.toFixed(1)} <br><br>
      <b>Exercícios sugeridos:</b><br>${exercicios}<br><br>
      <b>Alimentação básica:</b><br>${alimentacao}
    `;
  }
</script>

</body>
</html>
