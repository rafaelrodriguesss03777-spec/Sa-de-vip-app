<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.card{
  background:#151515;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}
.vip{
  border:2px solid gold;
}
h2,h3{
  margin:0 0 10px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:gold;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}
.progress span{
  display:block;
  height:100%;
  background:gold;
}

/* CALENDÁRIO */
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:8px;
}
.day{
  background:#000;
  border-radius:10px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:bold;
  font-size:14px;
}
.day.done{
  color:#00ff5a;
  font-size:20px;
}

.hidden{display:none;}
.box{
  background:#1f1f1f;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}
</style>
</head>

<body>
<div class="container">

  <!-- META -->
  <div class="card">
    <h2>🎯 Escolha sua meta</h2>
    <select id="goal" style="width:100%;padding:12px;border-radius:10px;">
      <option value="">Selecione</option>
      <option value="emagrecer">Emagrecer</option>
      <option value="ganhar">Ganhar massa</option>
      <option value="definir">Definir corpo</option>
    </select>
  </div>

  <!-- VIP -->
  <div class="card vip">
    <h2>⭐ VIP</h2>
    <p>Dia <b id="dayCount">1</b>/30</p>
    <div class="progress"><span id="bar"></span></div>

    <div id="vipContent" class="hidden">

      <div class="box">
        <h3>🥗 Alimentação VIP do Dia</h3>
        <div id="food"></div>
      </div>

      <div class="box">
        <h3>🔥 Treino VIP do Dia</h3>
        <div id="workout"></div>
      </div>

      <button onclick="finishDay()">✅ Concluir treino do dia</button>

      <h3 style="margin-top:16px;">📅 Seu progresso</h3>
      <div class="grid" id="calendar"></div>

      <h3>📊 Gráfico de Progresso</h3>
      <canvas id="chart"></canvas>

    </div>

    <button id="unlockBtn" onclick="unlockVIP()">🔓 Desbloquear VIP</button>
  </div>

</div>

<script>
// ===== DADOS =====
const foods={
  emagrecer:[
    ["🍳 Ovos","🥗 Frango","🌙 Salada"],
    ["🥣 Aveia","🐟 Peixe","🌙 Sopa"],
    ["🍞 Integral","🥗 Proteína","🌙 Omelete"]
  ],
  ganhar:[
    ["🥞 Panqueca","🍛 Arroz + frango","🌙 Shake"],
    ["🥣 Aveia + banana","🍝 Massa","🌙 Ovos"],
    ["🍞 Pão + ovos","🍛 Carne","🌙 Vitamina"]
  ],
  definir:[
    ["🍳 Ovos + aveia","🥗 Frango","🌙 Omelete"],
    ["🥣 Iogurte","🍛 Carne + arroz","🌙 Salada"],
    ["🍞 Integral","🐟 Peixe","🌙 Sopa"]
  ]
};

const workouts={
  emagrecer:[
    ["🚶 Caminhada 30min","🔥 Polichinelo","🧘 Alongamento"],
    ["🚴 Bike 20min","🔥 Agachamento","🧘 Prancha"],
    ["🏃 Corrida leve","🔥 Burpee","🧘 Yoga"]
  ],
  ganhar:[
    ["🏋️ Peito","💪 Flexão","🧘 Alongamento"],
    ["🏋️ Pernas","💪 Agachamento","🧘 Prancha"],
    ["🏋️ Braços","💪 Rosca","🧘 Alongamento"]
  ],
  definir:[
    ["🔥 Circuito","💪 Flexão","🧘 Prancha"],
    ["🏃 Cardio","🔥 Agachamento","🧘 Alongamento"],
    ["💪 Corpo inteiro","🔥 Abdominal","🧘 Yoga"]
  ]
};

// ===== ESTADO =====
let vip = localStorage.getItem("vip")==="true";
let day = Number(localStorage.getItem("day")||1);
let doneDays = JSON.parse(localStorage.getItem("doneDays")||"[]");
let chart=null;

// ===== FUNÇÕES =====
function unlockVIP(){
  localStorage.setItem("vip","true");
  vip=true;
  alert("🎉 VIP desbloqueado!");
  loadVIP();
}

function loadVIP(){
  if(!vip) return;
  const goal=document.getElementById("goal").value;
  if(!goal) return;

  document.getElementById("vipContent").classList.remove("hidden");
  document.getElementById("unlockBtn").style.display="none";

  document.getElementById("dayCount").innerText=day;
  document.getElementById("bar").style.width=(day/30*100)+"%";

  document.getElementById("food").innerHTML=
    foods[goal][(day-1)%foods[goal].length].join("<br>");
  document.getElementById("workout").innerHTML=
    workouts[goal][(day-1)%workouts[goal].length].join("<br>");

  renderCalendar();
  renderChart();
}

function finishDay(){
  if(!doneDays.includes(day)){
    doneDays.push(day);
    localStorage.setItem("doneDays",JSON.stringify(doneDays));
    alert("🎉 Parabéns! Dia concluído!");
    day++;
    if(day>30) day=1;
    localStorage.setItem("day",day);
    loadVIP();
  }
}

function renderCalendar(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  for(let i=1;i<=30;i++){
    const d=document.createElement("div");
    d.className="day";
    if(doneDays.includes(i)){
      d.classList.add("done");
      d.textContent="✔️";
    }else{
      d.textContent=i;
    }
    cal.appendChild(d);
  }
}

function renderChart(){
  const ctx=document.getElementById("chart");
  if(chart) chart.destroy();
  chart=new Chart(ctx,{
    type:"line",
    data:{
      labels:[...Array(30)].map((_,i)=>i+1),
      datasets:[{
        label:"Dias concluídos",
        data:[...Array(30)].map((_,i)=>doneDays.includes(i+1)?1:0),
        borderColor:"gold",
        backgroundColor:"rgba(255,215,0,0.2)",
        tension:0.4
      }]
    },
    options:{scales:{y:{min:0,max:1}}}
  });
}

document.getElementById("goal").addEventListener("change",loadVIP);
loadVIP();
</script>
</body>
</html>
