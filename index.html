<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP & Grátis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
  margin:0;
  font-family: Arial,sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{max-width:420px;margin:auto;padding:16px;}
.card{
  background:#151515;border-radius:16px;padding:16px;
  margin-bottom:16px;box-shadow:0 0 20px rgba(255,255,255,0.05);
}
h2,h3{margin:0 0 10px;}
select,button{
  width:100%;padding:14px;border-radius:12px;
  border:none;font-size:16px;
}
button{font-weight:bold;cursor:pointer;}
.progress{height:10px;background:#333;border-radius:10px;overflow:hidden;margin-bottom:10px;}
.progress span{display:block;height:100%;transition:width 0.5s;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day{background:#000;border-radius:8px;text-align:center;padding:10px 0;font-size:12px;}
.day.done{background:#0a0;color:#0f0;font-weight:bold;}
.box{background:#1f1f1f;padding:12px;border-radius:12px;margin-bottom:12px;border:1px solid #444;}
.period b{color:#ffd700;}
.hidden{display:none;}
.nav{display:flex;gap:10px;margin-bottom:16px;}
.btn-free{background:linear-gradient(90deg,#00ff00,#00cc00);}
.btn-vip{background:linear-gradient(90deg,#FFD700,#FFEA00);}
.vip-card{border:3px solid gold;box-shadow:0 0 20px gold;}
.exercise-item{margin:5px 0;}
</style>
</head>

<body>
<div class="container">

<div class="nav">
  <button class="btn-free" onclick="showPage('free')">🆓 Plano Grátis</button>
  <button class="btn-vip" onclick="showPage('vip')">⭐ VIP</button>
</div>

<div class="card">
<h2>🎯 Escolha sua meta</h2>
<select id="goal">
<option value="">Selecione</option>
<option value="emagrecer">Emagrecer</option>
<option value="ganhar">Ganhar massa</option>
<option value="definir">Definir corpo</option>
</select>
</div>

<div id="pageFree" class="card">
<h2>🆓 Plano Grátis</h2>
<div class="box"><h3>🥗 Alimentação</h3><div id="foodFree"></div></div>
<div class="box"><h3>🔥 Treino</h3><div id="workoutFree"></div></div>
</div>

<div id="pageVIP" class="card vip-card hidden">
<h2>⭐ VIP</h2>

<div class="box">
<h3>⚙️ Preferências VIP</h3>
<select id="gender">
  <option value="masculino">Masculino</option>
  <option value="feminino">Feminino</option>
</select>
<br><br>
<select id="difficulty">
  <option value="facil">Fácil</option>
  <option value="medio">Médio</option>
  <option value="dificil">Difícil</option>
</select>
</div>

<p>Dia <b id="dayCount">1</b>/30</p>
<div class="progress"><span id="bar"></span></div>

<div class="box">
<h3>🔥 Treino VIP do Dia</h3>
<div id="exercisesList"></div>
</div>

<button id="finishBtn">✅ Concluir treino</button>
<button id="resetBtn" style="margin-top:10px;">🔄 Reiniciar</button>

<h3>📅 Progresso</h3>
<div class="grid" id="calendar"></div>

<h3>📊 Gráfico</h3>
<canvas id="chart"></canvas>

<button id="unlockBtn" onclick="unlockVIP()">🔓 Desbloquear VIP</button>
</div>
</div>

<script>
function showPage(p){
  pageFree.style.display=p==="free"?"block":"none";
  pageVIP.style.display=p==="vip"?"block":"none";
}

const workoutLevels={
facil:(i)=>[`Agachamento 2x10`,`Flexão 2x8`,`Prancha 20s`],
medio:(i)=>[`Agachamento 3x12`,`Flexão 3x10`,`Prancha 30s`],
dificil:(i)=>[`Agachamento 4x15`,`Flexão 4x12`,`Prancha 45s`]
};

let vip=localStorage.getItem("vip")==="true";
let doneDays=JSON.parse(localStorage.getItem("doneDays")||"[]");

function unlockVIP(){
  localStorage.setItem("vip","true");
  vip=true;
  loadAll();
}

function getDay(){
  const s=new Date(localStorage.getItem("vipStart")||new Date());
  if(!localStorage.getItem("vipStart")) localStorage.setItem("vipStart",s);
  return Math.min(Math.floor((new Date()-s)/86400000),29);
}

function loadAll(){
  const goal=goalSel.value;
  if(!goal || !vip) return;

  unlockBtn.style.display="none";
  const d=getDay();
  dayCount.innerText=d+1;
  bar.style.width=((d+1)/30*100)+"%";

  const diff=difficulty.value;
  const exs=workoutLevels[diff](d);

  exercisesList.innerHTML="";
  exs.forEach(e=>{
    const div=document.createElement("div");
    div.className="exercise-item";
    div.innerHTML=`<input type="checkbox"> ${e}`;
    exercisesList.appendChild(div);
  });

  renderCalendar();
  renderChart();
}

function renderCalendar(){
  calendar.innerHTML="";
  for(let i=1;i<=30;i++){
    const d=document.createElement("div");
    d.className="day"+(doneDays.includes(i)?" done":"");
    d.innerText=doneDays.includes(i)?"✅":i;
    calendar.appendChild(d);
  }
}

finishBtn.onclick=()=>{
  const d=getDay()+1;
  if(!doneDays.includes(d)) doneDays.push(d);
  localStorage.setItem("doneDays",JSON.stringify(doneDays));
  loadAll();
};

resetBtn.onclick=()=>{
  localStorage.clear();
  location.reload();
};

goalSel=document.getElementById("goal");
difficulty=document.getElementById("difficulty");

goalSel.onchange=loadAll;
difficulty.onchange=loadAll;

showPage("free");
</script>
</body>
</html>
