<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saúde VIP</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2f2f2;
}
.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}
.section{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 6px 15px rgba(0,0,0,.12);
}
.tabs{
  display:flex;
}
.tab{
  flex:1;
  padding:10px;
  text-align:center;
  cursor:pointer;
  border-radius:10px 10px 0 0;
}
.tab.active{
  background:#000;
  color:#FFD700;
  font-weight:bold;
}
.card{
  background:#fafafa;
  padding:12px;
  border-radius:12px;
  margin-top:8px;
}
.vip-card{
  background:linear-gradient(135deg,#000,#1b1b1b);
  color:#FFD700;
  border:2px solid #FFD700;
  border-radius:14px;
  padding:14px;
  margin-top:10px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}
.btn-vip{
  background:#FFD700;
  font-weight:bold;
}
.done{
  background:#d4edda;
  color:#155724;
  text-align:center;
}
.progress{
  font-weight:bold;
  text-align:center;
  margin-bottom:6px;
}
.bar{
  background:#ddd;
  height:8px;
  border-radius:5px;
}
.fill{
  background:#FFD700;
  height:100%;
  width:0%;
  border-radius:5px;
}
</style>
</head>

<body>
<div class="container">

<!-- META -->
<div class="section">
<h3>🎯 Escolha sua meta</h3>
<select id="goal" style="width:100%;padding:10px;border-radius:10px">
<option value="">Selecione</option>
<option value="emagrecer">Emagrecer</option>
<option value="massa">Ganhar Massa</option>
<option value="definir">Definir</option>
</select>
</div>

<!-- TABS -->
<div class="section">
<div class="tabs">
  <div class="tab active" onclick="showFree()">Grátis</div>
  <div class="tab" onclick="showVIP()">VIP ⭐</div>
</div>

<!-- GRÁTIS -->
<div id="free">
<h4>🥗 Alimentação Básica</h4>
<div class="card" id="freeFood">Escolha a meta</div>

<h4>💪 Treino Básico</h4>
<div id="freeTrain"></div>
</div>

<!-- VIP -->
<div id="vip" style="display:none">

<div class="progress" id="progressText">Dia 0/30</div>
<div class="bar"><div class="fill" id="barFill"></div></div>

<div id="vipLocked">
<div class="vip-card">
🔒 Desbloqueie o VIP para acessar<br>
🍽️ Alimentação diária<br>
💪 Treinos avançados
</div>
<button class="btn-vip" onclick="unlockVIP()">💰 Comprar VIP (Pix)</button>
</div>

<div id="vipContent" style="display:none">

<h4>🥗 Alimentação VIP do Dia</h4>
<div class="vip-card" id="vipFood"></div>

<h4>🔥 Treino VIP do Dia</h4>
<div class="vip-card" id="vipTrain"></div>

<button class="btn-vip" onclick="completeDay()">✅ Concluir treino do dia</button>

<div id="msg"></div>

<button class="btn-vip" id="resetBtn" onclick="resetProgress()" style="display:none">
🔁 Começar novo progresso
</button>

</div>
</div>
</div>
</div>

<script>
let day = Number(localStorage.getItem("day")) || 1;
let vip = localStorage.getItem("vip") === "true";

const freeData={
  emagrecer:{food:"Frutas, ovos e salada",train:["Caminhada 15min","Agachamento 2/15"]},
  massa:{food:"Arroz, ovo e frango",train:["Flexão 2/10","Agachamento 2/15"]},
  definir:{food:"Proteína e legumes",train:["Prancha 2/30s","Abdominal 2/20"]}
};

function vipFood(goal,day){
  const foods={
    emagrecer:[
      "Ovos + fruta / Frango + salada / Sopa leve",
      "Vitamina / Peixe + legumes / Omelete",
      "Iogurte / Frango grelhado / Salada",
      "Ovos / Carne magra + arroz / Legumes"
    ],
    massa:[
      "Ovos + pão / Arroz + frango / Macarrão",
      "Vitamina + aveia / Carne + arroz / Batata",
      "Panqueca / Frango + macarrão / Ovos",
      "Iogurte + granola / Carne / Arroz"
    ],
    definir:[
      "Frutas / Frango + legumes / Salada",
      "Ovos / Peixe + legumes / Sopa",
      "Iogurte / Frango / Salada",
      "Vitamina / Carne magra / Legumes"
    ]
  };
  const menu=foods[goal][(day-1)%foods[goal].length];
  return `
<b>☀️ Café:</b> ${menu.split("/")[0]}<br><br>
<b>🍛 Almoço:</b> ${menu.split("/")[1]}<br><br>
<b>🌙 Jantar:</b> ${menu.split("/")[2]}<br><br>
<small>📆 Dia ${day}</small>`;
}

function vipTrain(day){
  return `
<b>🌅 Manhã</b><br>
Caminhada ${20+day} min<br><br>

<b>🌞 Tarde</b><br>
Agachamento 3/${15+day}<br>
Flexão 3/${10+day}<br><br>

<b>🌙 Noite</b><br>
Abdominal 3/${20+day}<br>
Prancha 3/${30+day}s`;
}

function showFree(){
  free.style.display="block";
  vip.style.display="none";
}
function showVIP(){
  free.style.display="none";
  vip.style.display="block";
  loadVIP();
}

function unlockVIP(){
  localStorage.setItem("vip","true");
  vip=true;
  alert("🎉 VIP liberado!");
  loadVIP();
}

function loadVIP(){
  if(!vip){
    vipLocked.style.display="block";
    vipContent.style.display="none";
    return;
  }
  vipLocked.style.display="none";
  vipContent.style.display="block";

  const goal=document.getElementById("goal").value;
  if(!goal)return;

  vipFoodEl.innerHTML=vipFood(goal,day);
  vipTrainEl.innerHTML=vipTrain(day);
  progressText.innerText=`Dia ${day}/30`;
  barFill.style.width=(day/30*100)+"%";
}

function completeDay(){
  if(day<30){
    day++;
    localStorage.setItem("day",day);
    msg.innerHTML=`<div class="done card">🎉 Parabéns! Volte amanhã.</div>`;
    loadVIP();
  }else{
    msg.innerHTML=`<div class="done card">🏆 Você concluiu os 30 dias!</div>`;
    resetBtn.style.display="block";
  }
}

function resetProgress(){
  day=1;
  localStorage.setItem("day",1);
  resetBtn.style.display="none";
  loadVIP();
}

goal.onchange=()=>{
  const g=goal.value;
  if(!g)return;
  freeFood.innerText=freeData[g].food;
  freeTrain.innerHTML="";
  freeData[g].train.forEach(t=>{
    freeTrain.innerHTML+=`<div class="card">${t}</div>`;
  });
  if(vip)loadVIP();
};
</script>

</body>
</html>
