<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Fitness VIP + Grátis Completo</title>
<style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f0f0f0; }
    .container { max-width: 420px; margin:0 auto; padding:20px; }
    .section { margin-bottom:20px; padding:15px; border-radius:10px; background:#fff; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
    .tabs { display:flex; margin-bottom:10px; }
    .tab { flex:1; padding:10px; text-align:center; cursor:pointer; border-bottom:3px solid transparent; border-radius:5px 5px 0 0; transition: all 0.3s; }
    .tab.active { border-bottom:3px solid #FFD700; font-weight:bold; color:#FFD700; background:#000; }
    .tab:hover { transform: scale(1.05); }
    select { width:100%; padding:10px; border-radius:5px; margin-top:10px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; transition: opacity 0.5s; }
    .card { padding:10px; border-radius:10px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.15); transition: transform 0.2s, box-shadow 0.3s, background 0.3s; }
    
    /* Correção da Barra de Progresso que faltava */
    .progressBar { width: 100%; background: #eee; border-radius: 10px; height: 10px; margin: 10px 0; overflow: hidden; }
    #progressFill { height: 100%; background: #FFD700; width: 0%; transition: width 0.5s; }
    
    .vip-card { background:#000; color:#FFD700; font-weight:bold; position:relative; overflow:hidden; animation: glow 2s infinite; border:2px solid #FFD700; padding:15px; border-radius:12px; transition: transform 0.3s; }
    @keyframes glow {0%,100%{box-shadow:0 0 10px #FFD700;}50%{box-shadow:0 0 25px #FFD700;}}
    
    .btn { margin-top:10px; padding:10px 15px; border:none; border-radius:5px; cursor:pointer; transition: all 0.3s; }
    .btn-vip { background:#FFD700; color:#000; font-weight:bold; width:100%; cursor: pointer; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>

<div class="container">
  <div class="section">
    <h2>Escolha sua Meta</h2>
    <select id="goalSelect">
      <option value="" selected disabled>Selecione sua meta</option>
      <option value="emagrecer">Emagrecer</option>
      <option value="massa">Ganhar Massa</option>
      <option value="definir">Definir Corpo</option>
    </select>
  </div>

  <div class="section">
    <div class="tabs">
      <div class="tab active" id="tabFree">Grátis</div>
      <div class="tab" id="tabVIP">VIP</div>
    </div>

    <div id="contentFree">
      <h3 class="gratis">Alimentação Recomendada</h3>
      <div id="nutritionFree" class="card">Selecione sua meta.</div>
      <h3 class="gratis">Treinos Recomendados</h3>
      <div id="trainingFree" class="grid"><div class="card">Selecione sua meta.</div></div>
    </div>

    <div id="contentVIP" style="display:none;">
      <div class="progress" id="vipProgress">Dias completados: 0/30</div>
      <div class="progressBar"><div id="progressFill"></div></div>
      <h3 class="vip">Alimentação VIP</h3>
      <div id="nutritionVIP" class="vip-card">💰 Compre o VIP!</div>
      <h3 class="vip">Treinos VIP</h3>
      <div id="trainingVIP" class="vip-card card">
        <strong id="dayTitleVIP">Dia -</strong>
        <ul id="exercisesVIP"><li>💰 Compre o VIP!</li></ul>
        <button class="btn btn-vip" id="completeBtnVIP" disabled>Concluir treino do dia</button>
        <div class="message" id="messageVIP"></div>
      </div>
      <button class="btn btn-vip" id="unlockBtn">Comprar VIP</button>
    </div>
  </div>
</div>

<script>
// Aguarda o carregamento total do DOM
document.addEventListener('DOMContentLoaded', () => {
    
    const tabFree = document.getElementById('tabFree');
    const tabVIP = document.getElementById('tabVIP');
    const contentFree = document.getElementById('contentFree');
    const contentVIP = document.getElementById('contentVIP');
    const goalSelect = document.getElementById('goalSelect');
    const trainingFreeEl = document.getElementById('trainingFree');
    const nutritionFreeEl = document.getElementById('nutritionFree');
    const exercisesVIPEl = document.getElementById('exercisesVIP');
    const nutritionVIPEl = document.getElementById('nutritionVIP');
    const completeBtnVIP = document.getElementById('completeBtnVIP');
    const dayTitleVIP = document.getElementById('dayTitleVIP');
    const vipProgress = document.getElementById('vipProgress');
    const progressFill = document.getElementById('progressFill');
    const unlockBtn = document.getElementById('unlockBtn');

    // Estado do App
    let currentDayVIP = parseInt(localStorage.getItem('currentDayVIP')) || 1;
    let completedDaysVIP = JSON.parse(localStorage.getItem('completedDaysVIP')) || [];

    // Dados
    const exercisesFree = {
        emagrecer:["Caminhada 15min","Abdominal 2/15","Agachamento 2/12"],
        massa:["Flexão 3/10","Agachamento 3/12","Prancha 2/1min"],
        definir:["Burpee 2/10","Prancha 2/1min","Abdominal 2/20"]
    };

    const nutritionFree = {
        emagrecer:["Frutas e Proteína","Suco detox","Salada leve"],
        massa:["Ovos e Batata Doce","Frango","Arroz e Feijão"],
        definir:["Vegetais e Peixe","Frutas","Omelete"]
    };

    // Tabs Eventos
    tabFree.addEventListener('click', ()=>{ 
        tabFree.classList.add('active'); tabVIP.classList.remove('active'); 
        contentFree.style.display='block'; contentVIP.style.display='none'; 
    });
    
    tabVIP.addEventListener('click', ()=>{ 
        tabVIP.classList.add('active'); tabFree.classList.remove('active'); 
        contentVIP.style.display='block'; contentFree.style.display='none'; 
        loadVIP();
    });

    function loadFree(){
        const goal = goalSelect.value;
        if(!goal) return;
        nutritionFreeEl.textContent = nutritionFree[goal][0];
        trainingFreeEl.innerHTML = '';
        exercisesFree[goal].forEach(ex => {
            const div = document.createElement('div'); div.className = 'card'; div.textContent = ex;
            trainingFreeEl.appendChild(div);
        });
    }

    function loadVIP(){
        const goal = goalSelect.value;
        const isUnlocked = localStorage.getItem('vipUnlocked') === 'true';

        if(!isUnlocked){
            completeBtnVIP.disabled = true;
            unlockBtn.style.display = 'block';
            return;
        }

        unlockBtn.style.display = 'none';
        completeBtnVIP.disabled = false;
        
        if(goal){
            dayTitleVIP.textContent = `Dia ${currentDayVIP}`;
            nutritionVIPEl.textContent = `Plano Especial Dia ${currentDayVIP} para ${goal}`;
            exercisesVIPEl.innerHTML = `<li>Treino Intensivo de ${goal}</li><li>Foco no Dia ${currentDayVIP}</li>`;
            vipProgress.textContent = `Dias completados: ${completedDaysVIP.length}/30`;
            progressFill.style.width = (completedDaysVIP.length / 30 * 100) + '%';
        }
    }

    goalSelect.addEventListener('change', () => { loadFree(); loadVIP(); });

    unlockBtn.addEventListener('click', () => {
        localStorage.setItem('vipUnlocked', 'true');
        alert("🎉 VIP Ativado!");
        loadVIP();
    });

    completeBtnVIP.addEventListener('click', () => {
        if(currentDayVIP <= 30){
            completedDaysVIP.push(currentDayVIP);
            currentDayVIP++;
            localStorage.setItem('currentDayVIP', currentDayVIP);
            localStorage.setItem('completedDaysVIP', JSON.stringify(completedDaysVIP));
            loadVIP();
        }
    });
});
</script>
</body>
</html>
