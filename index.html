<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  padding: 15px;
}
.box {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  max-width: 420px;
  margin: auto;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
h2, h3 {
  text-align: center;
}
.section {
  margin-top: 20px;
}
button, select {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
}
button {
  background: #28a745;
  color: #fff;
  border: none;
}
.vip {
  background: #fff8e1;
  border: 2px solid gold;
}
.lock {
  color: #999;
  text-align: center;
}
.success {
  background: #d4edda;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  margin-top: 15px;
}
.calendar span {
  display: inline-block;
  width: 40px;
  padding: 8px;
  margin: 4px;
  border-radius: 6px;
  background: #eee;
}
.done {
  background: #28a745;
  color: white;
}
</style>
</head>

<body>

<div class="box">
<h2>💪 Saúde VIP</h2>

<div class="section">
<h3>🎯 Escolha sua meta</h3>
<select id="meta">
  <option value="">Selecione</option>
  <option value="emagrecer">Emagrecer</option>
  <option value="massa">Ganhar massa</option>
  <option value="definir">Definir corpo</option>
</select>
</div>

<div class="section">
<h3>🆓 Plano Grátis</h3>
<ul id="treinosGratis"></ul>
<ul id="alimentacaoGratis"></ul>
</div>

<div class="section vip">
<h3>⭐ Plano VIP</h3>

<label>📅 Meta de dias</label>
<select id="diasMeta">
  <option value="7">7 dias</option>
  <option value="14">14 dias</option>
  <option value="21">21 dias</option>
  <option value="30">30 dias</option>
</select>

<p id="progresso">Progresso: 0 / 7</p>

<button onclick="concluirTreino()">Concluir treino do dia</button>

<div class="calendar" id="calendario"></div>

<div id="mensagem" class="success" style="display:none;">
  <p id="textoMensagem"></p>
  <button onclick="novaMeta()">Criar nova meta</button>
</div>
</div>

<div class="section">
<h3>🏆 Ranking</h3>
<p>🥇 Você — <span id="ranking">0</span> dias</p>
</div>

</div>

<script>
const treinos = {
  emagrecer: ["Caminhada", "Corrida leve", "Abdominal"],
  massa: ["Agachamento", "Flexão", "Supino"],
  definir: ["Prancha", "Abdominal", "Flexão"]
};

const alimentos = {
  emagrecer: ["Salada", "Frango grelhado", "Ovos"],
  massa: ["Arroz", "Carne", "Batata doce"],
  definir: ["Peixe", "Legumes", "Ovos"]
};

let dados = JSON.parse(localStorage.getItem("saudeVIP")) || {
  meta: "",
  diasMeta: 7,
  diasConcluidos: 0,
  ultimoDia: ""
};

document.getElementById("meta").value = dados.meta;
document.getElementById("diasMeta").value = dados.diasMeta;

document.getElementById("meta").addEventListener("change", atualizarConteudo);
document.getElementById("diasMeta").addEventListener("change", salvar);

atualizarConteudo();
atualizarTela();

function atualizarConteudo() {
  const meta = document.getElementById("meta").value;
  const t = document.getElementById("treinosGratis");
  const a = document.getElementById("alimentacaoGratis");
  t.innerHTML = a.innerHTML = "";

  if (!meta) return;

  treinos[meta].forEach(x => t.innerHTML += `<li>🏋️ ${x}</li>`);
  alimentos[meta].forEach(x => a.innerHTML += `<li>🥗 ${x}</li>`);

  salvar();
}

function concluirTreino() {
  const hoje = new Date().toDateString();
  if (dados.ultimoDia === hoje) {
    alert("Você já concluiu hoje 💪");
    return;
  }
  dados.diasConcluidos++;
  dados.ultimoDia = hoje;
  salvar();

  if (dados.diasConcluidos >= dados.diasMeta) {
    document.getElementById("textoMensagem").innerText =
      `🎉 Parabéns! Você concluiu sua meta de ${dados.diasMeta} dias!`;
    document.getElementById("mensagem").style.display = "block";
  }

  atualizarTela();
}

function novaMeta() {
  dados.diasConcluidos = 0;
  dados.ultimoDia = "";
  document.getElementById("mensagem").style.display = "none";
  salvar();
  atualizarTela();
}

function salvar() {
  dados.meta = document.getElementById("meta").value;
  dados.diasMeta = Number(document.getElementById("diasMeta").value);
  localStorage.setItem("saudeVIP", JSON.stringify(dados));
}

function atualizarTela() {
  document.getElementById("progresso").innerText =
    `Progresso: ${dados.diasConcluidos} / ${dados.diasMeta}`;
  document.getElementById("ranking").innerText = dados.diasConcluidos;

  const cal = document.getElementById("calendario");
  cal.innerHTML = "";
  for (let i = 1; i <= dados.diasMeta; i++) {
    cal.innerHTML += `<span class="${i <= dados.diasConcluidos ? 'done' : ''}">${i}</span>`;
  }
}
</script>

</body>
</html>
