<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #0f9d58, #34a853);
  padding: 20px;
}

.app {
  background: #fff;
  max-width: 420px;
  margin: auto;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,.3);
}

h2 {
  text-align: center;
  color: #0f9d58;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.tabs button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.tabs .active {
  background: #0f9d58;
  color: white;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

select, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 12px;
  font-size: 15px;
}

button {
  background: #0f9d58;
  color: white;
  border: none;
  font-weight: bold;
}

.vip {
  background: linear-gradient(135deg, #fff8e1, #fff1b8);
  border: 3px solid gold;
  border-radius: 18px;
  padding: 15px;
  margin-top: 10px;
}

.calendar span {
  display: inline-block;
  width: 38px;
  height: 38px;
  line-height: 38px;
  margin: 4px;
  border-radius: 50%;
  background: #ddd;
  font-weight: bold;
}

.calendar .done {
  background: #0f9d58;
  color: white;
}

.success {
  background: #e6ffed;
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
  text-align: center;
}
</style>
</head>

<body>

<div class="app">
  <h2>💪 Saúde VIP</h2>

  <div class="tabs">
    <button id="btnGratis" class="active" onclick="abrir('gratis')">🆓 Grátis</button>
    <button id="btnVip" onclick="abrir('vip')">⭐ VIP</button>
  </div>

  <h3>🎯 Escolha sua meta</h3>
  <select id="meta" onchange="atualizarConteudo()">
    <option value="">Selecione</option>
    <option value="emagrecer">Emagrecer</option>
    <option value="massa">Ganhar massa</option>
    <option value="definir">Definir corpo</option>
  </select>

  <!-- GRÁTIS -->
  <div id="gratis" class="section active">
    <h3>Treinos Grátis</h3>
    <ul id="treinosGratis"></ul>

    <h3>Alimentação</h3>
    <ul id="alimentacaoGratis"></ul>
  </div>

  <!-- VIP -->
  <div id="vip" class="section">
    <div class="vip">
      <h3>⭐ Treinos VIP</h3>
      <h4>🔥 Treino VIP do Dia</h4>
<ul id="treinoVipDia"></ul>

<h4>🥗 Alimentação VIP Recomendada</h4>
<ul id="alimentacaoVipDia"></ul><div class="section vip">
  

      <label>Meta de dias</label>
      <select id="diasMeta">
        <option value="7">7 dias</option>
        <option value="14">14 dias</option>
        <option value="21">21 dias</option>
        <option value="30">30 dias</option>
      </select>

      <p id="progresso">Progresso: 0 / 7</p>
      <button onclick="concluirTreino()">Concluir treino</button>

      <div class="calendar" id="calendario"></div>

      <div id="mensagem" class="success" style="display:none;">
        🎉 Parabéns! Meta concluída!
      </div>
    </div>
  </div>
</div>

<script>
const treinos = {
  emagrecer: ["Caminhada", "Corrida leve", "Abdominal"],
  massa: ["Agachamento", "Flexão", "Supino"],
  definir: ["Prancha", "Abdominal", "Flexão"]
};

const alimentos = {
  emagrecer: ["Salada", "Frango", "Ovos"],
  massa: ["Arroz", "Carne", "Batata doce"],
  definir: ["Peixe", "Legumes", "Ovos"]
};

let dados = JSON.parse(localStorage.getItem("vipApp")) || {
  meta: "",
  diasMeta: 7,
  dias: 0,
  ultimo: ""
};

function abrir(sec) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(sec).classList.add('active');
  document.getElementById("btnGratis").classList.remove("active");
  document.getElementById("btnVip").classList.remove("active");
  document.getElementById(sec === "gratis" ? "btnGratis" : "btnVip").classList.add("active");
}

function atualizarConteudo() {
  const m = meta.value;
  treinosGratis.innerHTML = "";
  alimentacaoGratis.innerHTML = "";
  if (!m) return;
  treinos[m].forEach(t => treinosGratis.innerHTML += `<li>${t}</li>`);
  alimentos[m].forEach(a => alimentacaoGratis.innerHTML += `<li>${a}</li>`);
  salvar();
}

function concluirTreino() {
  const hoje = new Date().toDateString();
  if (dados.ultimo === hoje) return alert("Já concluiu hoje");
  dados.dias++;
  dados.ultimo = hoje;
  salvar();
  atualizarVip();
}

function atualizarVip() {
  progresso.innerText = `Progresso: ${dados.dias} / ${dados.diasMeta}`;
  calendario.innerHTML = "";
  for (let i = 1; i <= dados.diasMeta; i++) {
    calendario.innerHTML += `<span class="${i <= dados.dias ? 'done':''}">${i}</span>`;
  }
  if (dados.dias >= dados.diasMeta) mensagem.style.display = "block";
}

function salvar() {
  dados.meta = meta.value;
  dados.diasMeta = Number(diasMeta.value);
  localStorage.setItem("vipApp", JSON.stringify(dados));
}

meta.value = dados.meta;
diasMeta.value = dados.diasMeta;
atualizarConteudo();
atualizarVip();
</script>

</body>
</html>
