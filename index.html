<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.card{
  background:#151515;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 0 20px rgba(255,215,0,0.05);
}
.vip{
  border:3px solid gold;
  background: linear-gradient(145deg, #1a1a1a, #222);
  box-shadow: 0 0 20px gold;
  animation: glow 2s infinite alternate;
  position: relative;
}
@keyframes glow {
  0% { box-shadow:0 0 15px gold; }
  50% { box-shadow:0 0 30px gold; }
  100% { box-shadow:0 0 15px gold; }
}
h2,h3{
  margin:0 0 10px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:gold;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition: transform 0.2s, box-shadow 0.3s;
}
button:hover{
  transform: scale(1.05);
  box-shadow:0 0 15px gold;
}
button.sec{
  background:#333;
  color:#fff;
}
.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}
.progress span{
  display:block;
  height:100%;
  background:gold;
}
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.day{
  padding:10px 0;
  background:#222;
  border-radius:8px;
  text-align:center;
  font-size:12px;
  color:#fff;
}
.day.done{
  background:green;
  color:#000;
  font-weight:bold;
}
.hidden{display:none;}
.box{
  background:#1f1f1f;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}
</style>
</head>

<body>
<div class="container">

  <!-- META -->
  <div class="card">
    <h2>🎯 Escolha sua meta</h2>
    <select id="goal" style="width:100%;padding:12px;border-radius:10px;">
      <option value="">Selecione</option>
      <option value="emagrecer">Emagrecer</option>
      <option value="ganhar">Ganhar massa</option>
      <option value="definir">Definir corpo</option>
    </select>
  </div>

  <!-- VIP -->
  <div class="card vip">
    <h2>⭐ VIP</h2>
    <p>Dia <b id="dayCount">1</b>/30</p>
    <div class="progress"><span id="bar"></span></div>

    <div id="vipContent" class="hidden">

      <div class="box">
        <h3>🥗 Alimentação VIP do Dia</h3>
        <div id="food"></div>
      </div>

      <div class="box">
        <h3>🔥 Treino VIP do Dia</h3>
        <div id="workout"></div>
      </div>

      <button onclick="finishDay()">✅ Concluir treino do dia</button>

      <h3 style="margin-top:16px;">📅 Seu progresso</h3>
      <div class="grid" id="calendar"></div>

      <h3>📊 Gráfico de Progresso</h3>
      <canvas id="chart"></canvas>

    </div>

    <button id="unlockBtn" onclick="unlockVIP()">🔓 Desbloquear VIP</button>
  </div>

</div>

<script>
// ====== DADOS ======
const foods = {
  emagrecer:[
    ["🍳 Café: Ovos","🥗 Almoço: Frango grelhado","🌙 Jantar: Salada leve"],
    ["🥣 Café: Aveia","🐟 Almoço: Peixe","🌙 Jantar: Sopa detox"],
    ["🍞 Café: Pão integral","🥗 Almoço: Salada proteica","🌙 Jantar: Omelete"]
  ],
  ganhar:[
    ["🥞 Café: Panqueca","🍛 Almoço: Arroz + frango","🌙 Jantar: Vitamina"],
    ["🥣 Café: Aveia + banana","🍝 Almoço: Macarrão","🌙 Jantar: Ovos"],
    ["🍞 Café: Pão + ovos","🍛 Almoço: Carne","🌙 Jantar: Shake"]
  ],
  definir:[
    ["🍳 Café: Ovos mexidos","🥗 Almoço: Salada + frango","🌙 Jantar: Peixe grelhado"],
    ["🥣 Café: Smoothie","🍝 Almoço: Macarrão integral","🌙 Jantar: Omelete"],
    ["🍞 Café: Pão integral","🥗 Almoço: Salada proteica","🌙 Jantar: Frango grelhado"]
  ]
};

const workouts = {
  emagrecer:[
    ["🚶 Caminhada 30min","🔥 Polichinelo 3x15","🧘 Alongamento 5min"],
    ["🚴 Bike 20min","🔥 Agachamento 3x12","🧘 Prancha 30s"],
    ["🏃 Corrida leve 25min","🔥 Burpee 3x10","🧘 Yoga 10min"]
  ],
  ganhar:[
    ["🏋️ Peito 3x12","💪 Flexão 3x15","🧘 Alongamento 5min"],
    ["🏋️ Pernas 3x12","💪 Agachamento 3x15","🧘 Prancha 30s"],
    ["🏋️ Braços 3x12","💪 Rosca 3x12","🧘 Alongamento 5min"]
  ],
  definir:[
    ["🚶 Caminhada 20min","🔥 Abdominal 3x20","🧘 Prancha 1min"],
    ["🚶 Corrida 20min","🔥 Flexão 3x12","🧘 Yoga 10min"],
    ["🚴 Bike 15min","🔥 Burpee 3x10","🧘 Alongamento 5min"]
  ]
};

// ====== ESTADO ======
let vip = localStorage.getItem("vip")==="true";
let day = Number(localStorage.getItem("day")||1);
let doneDays = JSON.parse(localStorage.getItem("doneDays")||"[]");
let progressChart = null;

// ====== VIP ======
function unlockVIP(){
  localStorage.setItem("vip","true");
  vip=true;
  alert("🎉 VIP desbloqueado!");
  loadVIP();
}

function loadVIP(){
  if(!vip) return;

  const goal = document.getElementById("goal").value;
  if(!goal) return;

  document.getElementById("vipContent").classList.remove("hidden");
  document.getElementById("unlockBtn").style.display="none";

  document.getElementById("dayCount").innerText=day;
  document.getElementById("bar").style.width=(day/30*100)+"%";

  const f = foods[goal][(day-1)%foods[goal].length];
  const w = workouts[goal][(day-1)%workouts[goal].length];

  document.getElementById("food").innerHTML=f.join("<br>");
  document.getElementById("workout").innerHTML=w.join("<br>");

  renderCalendar();
  renderChart();
  dailyNotification();
}

function finishDay(){
  if(!doneDays.includes(day)){
    doneDays.push(day);
    localStorage.setItem("doneDays",JSON.stringify(doneDays));
    alert("🎉 Parabéns! Dia concluído!");
    day++;
    if(day>30) day=1;
    localStorage.setItem("day",day);
    loadVIP();
  }
}

// ====== CALENDÁRIO ======
function renderCalendar(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  for(let i=1;i<=30;i++){
    const d=document.createElement("div");
    if(doneDays.includes(i)){
      d.className="day done";
      d.innerText="✔️";
    } else {
      d.className="day";
      d.innerText=i;
    }
    cal.appendChild(d);
  }
}

// ====== GRÁFICO ======
function renderChart(){
  const ctx=document.getElementById("chart");
  if(progressChart) progressChart.destroy();

  progressChart = new Chart(ctx,{
    type:"line",
    data:{
      labels:Array.from({length:30},(_,i)=>i+1),
      datasets:[{
        label:"Dias concluídos",
        data:Array.from({length:30},(_,i)=>doneDays.includes(i)?1:0),
        borderColor:"gold",
        backgroundColor:"rgba(255,215,0,0.2)",
        tension:0.4
      }]
    },
    options:{
      scales:{y:{min:0,max:1,ticks:{stepSize:1}}}
    }
  });
}

// ====== NOTIFICAÇÃO ======
function dailyNotification(){
  if(!vip) return;
  if(!("Notification" in window)) return;

  Notification.requestPermission().then(p=>{
    if(p==="granted"){
      const today=new Date().toDateString();
      if(localStorage.getItem("lastNotify")!==today){
        new Notification("💪 Hora do treino VIP!",{
          body:"Conclua seu treino de hoje!"
        });
        localStorage.setItem("lastNotify",today);
      }
    }
  });
}

document.getElementById("goal").addEventListener("change",loadVIP);
loadVIP();
</script>
</body>
</html>
