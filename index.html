<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Saúde e Metas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
    }
    h2 {
      text-align: center;
      color: green;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    .resultado {
      margin-top: 20px;
      background: #e8ffe8;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Saúde e Metas</h2>

  <label>Peso atual (kg)</label>
  <input type="number" id="pesoAtual">

  <label>Altura (cm)</label>
  <input type="number" id="altura">

  <label>Peso desejado (kg)</label>
  <input type="number" id="pesoDesejado">
<label>Qual é sua meta?</label>
<select id="meta">
  <option value="">Selecione</option>
  <option value="emagrecer">Emagrecer</option>
  <option value="massa">Ganhar massa</option>
  <option value="definicao">Definir o físico</option>
</select>
  <button onclick="calcular()">Ver sugestão</button>

  <div class="resultado" id="resultado"></div>
</div>

<script>
function calcular() {
  const pesoAtual = parseFloat(document.getElementById("pesoAtual").value);
  const altura = parseFloat(document.getElementById("altura").value);
  const pesoDesejado = parseFloat(document.getElementById("pesoDesejado").value);
  const meta = document.getElementById("meta").value;

  if (!pesoAtual || !altura || !pesoDesejado || !meta) {
    alert("Preencha todos os campos");
    return;
  }

  let plano = "";
  let alimentacao = "";
  let treino = "";

  // 🔓 PLANO GRÁTIS (automático simples)
  if (meta === "emagrecer") {
    plano = "Plano diário simples para emagrecimento";
    alimentacao = "Café da manhã leve, almoço equilibrado, jantar leve. Evite açúcar.";
    treino = "Caminhada ou corrida 30 min por dia.";
  }

  if (meta === "massa") {
    plano = "Plano diário simples para ganho de massa";
    alimentacao = "Mais proteínas e carboidratos ao longo do dia.";
    treino = "Treino de força 4x por semana.";
  }

  if (meta === "definicao") {
    plano = "Plano diário simples para definição corporal";
    alimentacao = "Alimentação equilibrada com proteínas.";
    treino = "Treino + cardio leve.";
  }

  document.getElementById("resultado").innerHTML = `
    <h3>${plano}</h3>

    <p><strong>Alimentação:</strong> ${alimentacao}</p>
    <p><strong>Treino:</strong> ${treino}</p>

    <hr>

    <p style="color: gray;">
      🔒 Plano VIP desbloqueia:
      <br>• Plano diário detalhado
      <br>• Ajuste por peso e altura
      <br>• Evolução diária
      <br>• Sugestões personalizadas
    </p>

    <button onclick="alert('Plano VIP em breve 💎')">
      Desbloquear VIP – R$5/mês
    </button>
  `;
}
</script>

</body>
</html>
