<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.card{
  background:#151515;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 0 20px rgba(255,215,0,0.08);
}
.vip{
  border:2px solid gold;
}
h2{
  margin:0 0 10px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:gold;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button.sec{
  background:#333;
  color:#fff;
}
.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
}
.progress span{
  display:block;
  height:100%;
  background:gold;
}
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.day{
  padding:10px 0;
  background:#222;
  border-radius:8px;
  text-align:center;
  font-size:12px;
}
.day.done{
  background:gold;
  color:#000;
  font-weight:bold;
}
.hidden{display:none;}
</style>
</head>

<body>
<div class="container">

  <!-- META -->
  <div class="card">
    <h2>🎯 Escolha sua meta</h2>
    <select id="goal" style="width:100%;padding:12px;border-radius:10px;">
      <option value="">Selecione</option>
      <option value="emagrecer">Emagrecer</option>
      <option value="ganhar">Ganhar massa</option>
    </select>
  </div>

  <!-- VIP -->
  <div class="card vip">
    <h2>⭐ VIP</h2>
    <p>Dia <b id="dayCount">1</b>/30</p>
    <div class="progress"><span id="bar"></span></div>

    <div id="vipContent" class="hidden">

      <h3>🥗 Alimentação VIP do Dia</h3>
      <div id="food"></div>

      <h3>🔥 Treino VIP do Dia</h3>
      <div id="workout"></div>

      <button onclick="finishDay()">✅ Concluir treino do dia</button>

      <h3 style="margin-top:16px;">📅 Seu progresso</h3>
      <div class="grid" id="calendar"></div>

      <h3>📊 Gráfico de Progresso</h3>
      <canvas id="chart"></canvas>

    </div>

    <button id="unlockBtn" onclick="unlockVIP()">🔓 Desbloquear VIP</button>
  </div>

</div>

<script>
const foods = [
 ["🍳 Café: Ovos","🍛 Almoço: Frango","🌙 Jantar: Sopa"],
 ["🥣 Café: Aveia","🍝 Almoço: Carne","🌙 Jantar: Omelete"],
 ["🍞 Café: Pão integral","🥗 Almoço: Peixe","🌙 Jantar: Salada"]
];

const workouts = [
 ["🚶 Manhã: Caminhada 20 min","🏋️ Tarde: Agachamento 3/20","🧘 Noite: Prancha 30s"],
 ["🚶 Manhã: Caminhada 25 min","🏋️ Tarde: Flexão 3/15","🧘 Noite: Abdominal 3/20"],
 ["🚶 Manhã: Caminhada 30 min","🏋️ Tarde: Agachamento 4/20","🧘 Noite: Prancha 40s"]
];

let vip = localStorage.getItem("vip")==="true";
let day = Number(localStorage.getItem("day")||1);
let doneDays = JSON.parse(localStorage.getItem("doneDays")||"[]");

function unlockVIP(){
  localStorage.setItem("vip","true");
  vip=true;
  alert("🎉 VIP desbloqueado!");
  loadVIP();
}

function loadVIP(){
  if(!vip) return;
  document.getElementById("vipContent").classList.remove("hidden");
  document.getElementById("unlockBtn").style.display="none";

  document.getElementById("dayCount").innerText=day;
  document.getElementById("bar").style.width=(day/30*100)+"%";

  const f=foods[(day-1)%foods.length];
  const w=workouts[(day-1)%workouts.length];

  document.getElementById("food").innerHTML=f.join("<br>");
  document.getElementById("workout").innerHTML=w.join("<br>");

  renderCalendar();
  renderChart();
}

function finishDay(){
  if(!doneDays.includes(day)){
    doneDays.push(day);
    localStorage.setItem("doneDays",JSON.stringify(doneDays));
    alert("🎉 Parabéns! Dia concluído!");
    day++;
    if(day>30) day=1;
    localStorage.setItem("day",day);
    loadVIP();
  }
}

function renderCalendar(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  for(let i=1;i<=30;i++){
    const d=document.createElement("div");
    d.className="day"+(doneDays.includes(i)?" done":"");
    d.innerText=i;
    cal.appendChild(d);
  }
}

function renderChart(){
  const ctx=document.getElementById("chart");
  new Chart(ctx,{
    type:"line",
    data:{
      labels:doneDays,
      datasets:[{
        label:"Dias concluídos",
        data:doneDays,
        borderColor:"gold",
        backgroundColor:"rgba(255,215,0,0.2)"
      }]
    }
  });
}

/* Notificação diária */
if("Notification" in window){
  Notification.requestPermission();
  if(Notification.permission==="granted"){
    new Notification("💪 Hora do seu treino VIP!");
  }
}

loadVIP();
</script>
</body>
</html>
