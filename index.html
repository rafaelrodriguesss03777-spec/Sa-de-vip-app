<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2f2f2;
}
header{
  background:linear-gradient(90deg,#2ecc71,#27ae60);
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}
.container{
  padding:15px;
}
select,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  font-size:16px;
}
button{
  background:#27ae60;
  color:#fff;
  cursor:pointer;
}
button.vip{
  background:#f39c12;
}
.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
.vip-box{
  background:linear-gradient(135deg,#f39c12,#e67e22);
  color:#fff;
}
.vip-box h2{
  margin-top:0;
}
.hidden{
  display:none;
}
.progress{
  font-size:18px;
  margin:10px 0;
}
.calendar{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
.day{
  padding:10px;
  border-radius:8px;
  text-align:center;
  background:#ddd;
}
.day.done{
  background:#2ecc71;
  color:#fff;
}
.day.miss{
  background:#e74c3c;
  color:#fff;
}
footer{
  text-align:center;
  font-size:13px;
  color:#666;
  margin-top:20px;
}
</style>
</head>

<body>

<header>🏋️ Saúde VIP</header>

<div class="container">

<!-- META -->
<div class="card">
  <h3>🎯 Escolha sua meta</h3>
  <select id="goal">
    <option value="">Selecione</option>
    <option value="emagrecer">Emagrecer</option>
    <option value="ganhar">Ganhar Massa</option>
    <option value="manter">Manter Saúde</option>
  </select>
</div>

<!-- GRATIS -->
<div class="card">
  <h3>🆓 Plano Grátis</h3>
  <div id="freeContent">Escolha uma meta</div>
</div>

<!-- VIP -->
<div class="card vip-box">
  <h2>💎 Plano VIP (30 dias)</h2>

  <div id="vipLocked">
    <p>🔒 Desbloqueie para ver treinos, alimentação e progresso</p>
    <button class="vip" onclick="unlockVIP()">Pagar com Pix</button>
  </div>

  <div id="vipContent" class="hidden">

    <div class="progress" id="dayInfo"></div>

    <h3>🏋️ Treino do Dia</h3>
    <div id="vipTraining"></div>

    <h3>🥗 Alimentação do Dia</h3>
    <div id="vipFood"></div>

    <button onclick="finishDay()">✅ Concluir treino do dia</button>

    <h3>📅 Seu progresso</h3>
    <div class="calendar" id="calendar"></div>

  </div>
</div>

</div>

<footer>Saúde VIP © 2026</footer>

<script>
const freeData={
  emagrecer:"Caminhada 20 min / Abdominais 3/15",
  ganhar:"Flexão 3/12 / Agachamento 3/15",
  manter:"Alongamento 15 min / Caminhada leve"
};

const vipTraining={
  emagrecer:[
    "Manhã: Cardio 30 min",
    "Tarde: Abdômen 4/20",
    "Noite: Caminhada 40 min"
  ],
  ganhar:[
    "Manhã: Peito 4/12",
    "Tarde: Pernas 4/15",
    "Noite: Bíceps 3/12"
  ],
  manter:[
    "Manhã: Yoga 20 min",
    "Tarde: Funcional 30 min",
    "Noite: Caminhada 30 min"
  ]
};

const vipFood={
  emagrecer:[
    "Café: Ovos + fruta",
    "Almoço: Frango + salada",
    "Jantar: Sopa leve"
  ],
  ganhar:[
    "Café: Vitamina + aveia",
    "Almoço: Arroz, carne e feijão",
    "Jantar: Massa + proteína"
  ],
  manter:[
    "Café: Fruta + pão integral",
    "Almoço: Prato balanceado",
    "Jantar: Leve"
  ]
};

let day=Number(localStorage.getItem("vipDay"))||1;
let completed=JSON.parse(localStorage.getItem("completedDays"))||[];

const goalSelect=document.getElementById("goal");

goalSelect.onchange=()=>{
  document.getElementById("freeContent").innerText=
    freeData[goalSelect.value]||"";
  loadVIP();
};

function unlockVIP(){
  localStorage.setItem("vip","true");
  loadVIP();
}

function loadVIP(){
  if(localStorage.getItem("vip")!=="true")return;
  document.getElementById("vipLocked").classList.add("hidden");
  document.getElementById("vipContent").classList.remove("hidden");

  document.getElementById("dayInfo").innerText=
    `📆 Dia ${day} de 30`;

  const g=goalSelect.value;
  if(!g)return;

  document.getElementById("vipTraining").innerHTML=
    vipTraining[g].join("<br>");

  document.getElementById("vipFood").innerHTML=
    vipFood[g].join("<br>");

  drawCalendar();
}

function finishDay(){
  if(!completed.includes(day)){
    completed.push(day);
    localStorage.setItem("completedDays",JSON.stringify(completed));
  }
  if(day<30){
    day++;
    localStorage.setItem("vipDay",day);
    alert("🎉 Parabéns! Volte amanhã!");
  }else{
    alert("🏆 Você concluiu os 30 dias! Pode iniciar um novo progresso.");
  }
  loadVIP();
}

function drawCalendar(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  for(let i=1;i<=30;i++){
    const d=document.createElement("div");
    d.className="day";
    d.innerText=i;
    if(completed.includes(i)) d.classList.add("done");
    else if(i<day) d.classList.add("miss");
    cal.appendChild(d);
  }
}

window.onload=loadVIP;
</script>

</body>
</html>
