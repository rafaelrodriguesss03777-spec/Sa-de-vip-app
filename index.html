<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2f2f2;
}
header{
  background:linear-gradient(90deg,#2ecc71,#27ae60);
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}
.container{
  padding:15px;
}
select,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  font-size:16px;
}
button{
  background:#27ae60;
  color:#fff;
  cursor:pointer;
}
button.vip{
  background:#f39c12;
}
.card{
  background:#fff;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 6px 15px rgba(0,0,0,0.1);
}
.vip-box{
  background:linear-gradient(135deg,#f39c12,#e67e22);
  color:#fff;
}
.vip-inner{
  background:#fff;
  color:#000;
  border-radius:15px;
  padding:15px;
  margin-top:10px;
}
.hidden{
  display:none;
}
.progress{
  font-size:18px;
  margin:10px 0;
  font-weight:bold;
}
.section-title{
  font-size:18px;
  margin-bottom:10px;
  color:#27ae60;
}
.calendar{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:10px;
}
.day{
  padding:10px;
  border-radius:8px;
  text-align:center;
  background:#ddd;
  font-size:14px;
}
.day.done{
  background:#2ecc71;
  color:#fff;
}
.day.miss{
  background:#e74c3c;
  color:#fff;
}
footer{
  text-align:center;
  font-size:13px;
  color:#666;
  margin:20px 0;
}
</style>
</head>

<body>

<header>🏋️ Saúde VIP</header>

<div class="container">

<!-- META -->
<div class="card">
  <h3>🎯 Escolha sua meta</h3>
  <select id="goal">
    <option value="">Selecione</option>
    <option value="emagrecer">Emagrecer</option>
    <option value="ganhar">Ganhar Massa</option>
    <option value="manter">Manter Saúde</option>
  </select>
</div>

<!-- GRÁTIS -->
<div class="card">
  <h3>🆓 Plano Grátis</h3>
  <div id="freeContent">Escolha uma meta</div>
</div>

<!-- VIP -->
<div class="card vip-box">
  <h2>💎 Plano VIP (30 dias)</h2>

  <div id="vipLocked">
    <p>🔒 Desbloqueie para ver treinos, alimentação e progresso</p>
    <button class="vip" onclick="unlockVIP()">Pagar com Pix</button>
  </div>

  <div id="vipContent" class="hidden">

    <div class="vip-inner">
      <div class="progress" id="dayInfo"></div>

      <!-- TREINO -->
      <div class="card">
        <div class="section-title">🏋️ Treino do Dia</div>
        <div id="vipTraining"></div>
      </div>

      <!-- ALIMENTAÇÃO -->
      <div class="card">
        <div class="section-title">🥗 Alimentação do Dia</div>
        <div id="vipFood"></div>
      </div>

      <button onclick="finishDay()">✅ Concluir treino do dia</button>

      <!-- PROGRESSO -->
      <div class="card">
        <div class="section-title">📅 Seu progresso (30 dias)</div>
        <div class="calendar" id="calendar"></div>
      </div>

    </div>

  </div>
</div>

</div>

<footer>Saúde VIP © 2026</footer>

<script>
const freeData={
  emagrecer:"Caminhada 20 min / Abdominais 3x15",
  ganhar:"Flexão 3x12 / Agachamento 3x15",
  manter:"Alongamento 15 min / Caminhada leve"
};

const vipTraining={
  emagrecer:[
    "🔥 Cardio 30 min",
    "💪 Abdômen 4x20",
    "🚶 Caminhada 40 min"
  ],
  ganhar:[
    "🏋️ Peito 4x12",
    "🦵 Pernas 4x15",
    "💪 Bíceps 3x12"
  ],
  manter:[
    "🧘 Yoga 20 min",
    "⚡ Funcional 30 min",
    "🚶 Caminhada 30 min"
  ]
};

const vipFood={
  emagrecer:[
    "☕ Café: Ovos + fruta",
    "🍛 Almoço: Frango + salada",
    "🥣 Jantar: Sopa leve"
  ],
  ganhar:[
    "☕ Café: Vitamina + aveia",
    "🍛 Almoço: Arroz, feijão e carne",
    "🍝 Jantar: Massa + proteína"
  ],
  manter:[
    "☕ Café: Fruta + pão integral",
    "🍛 Almoço: Prato balanceado",
    "🥗 Jantar: Leve"
  ]
};

let day=Number(localStorage.getItem("vipDay"))||1;
let completed=JSON.parse(localStorage.getItem("completedDays"))||[];

const goalSelect=document.getElementById("goal");

goalSelect.onchange=()=>{
  document.getElementById("freeContent").innerText=
    freeData[goalSelect.value]||"";
  loadVIP();
};

function unlockVIP(){
  localStorage.setItem("vip","true");
  loadVIP();
}

function loadVIP(){
  if(localStorage.getItem("vip")!=="true")return;
  document.getElementById("vipLocked").classList.add("hidden");
  document.getElementById("vipContent").classList.remove("hidden");

  document.getElementById("dayInfo").innerText=`📆 Dia ${day} de 30`;

  const g=goalSelect.value;
  if(!g)return;

  document.getElementById("vipTraining").innerHTML=
    vipTraining[g].join("<br>");

  document.getElementById("vipFood").innerHTML=
    vipFood[g].join("<br>");

  drawCalendar();
}

function finishDay(){
  if(!completed.includes(day)){
    completed.push(day);
    localStorage.setItem("completedDays",JSON.stringify(completed));
  }
  if(day<30){
    day++;
    localStorage.setItem("vipDay",day);
    alert("🎉 Parabéns! Meta do dia concluída. Volte amanhã!");
  }else{
    alert("🏆 Você concluiu os 30 dias! Pode iniciar um novo progresso.");
  }
  loadVIP();
}

function drawCalendar(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  for(let i=1;i<=30;i++){
    const d=document.createElement("div");
    d.className="day";
    d.innerText=i;
    if(completed.includes(i)) d.classList.add("done");
    else if(i<day) d.classList.add("miss");
    cal.appendChild(d);
  }
}

window.onload=loadVIP;
</script>

</body>
</html>
