<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Saúde e Metas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
    }
    h2 {
      text-align: center;
      color: green;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    .resultado {
      margin-top: 20px;
      background: #e8ffe8;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Saúde e Metas</h2>

  <label>Peso atual (kg)</label>
  <input type="number" id="pesoAtual">

  <label>Altura (cm)</label>
  <input type="number" id="altura">

  <label>Peso desejado (kg)</label>
  <input type="number" id="pesoDesejado">
<label>Qual é sua meta?</label>
<select id="meta">
  <option value="">Selecione</option>
  <option value="emagrecer">Emagrecer</option>
  <option value="massa">Ganhar massa</option>
  <option value="definicao">Definir o físico</option>
</select>
  <button onclick="calcular()">Ver sugestão</button>

  <div class="resultado" id="resultado"></div>
</div>

<script>
function calcular() {
  const pesoAtual = parseFloat(document.getElementById("pesoAtual").value);
  const alturaCm = parseFloat(document.getElementById("altura").value);
  const pesoDesejado = parseFloat(document.getElementById("pesoDesejado").value);

  const resultado = document.getElementById("resultado");

  if (!pesoAtual || !alturaCm || !pesoDesejado) {
    resultado.innerHTML = "⚠️ Preencha todos os campos.";
    return;
  }

  const altura = alturaCm / 100;
  const imc = (pesoAtual / (altura * altura)).toFixed(1);

  let exercicios = "";
  let alimentacao = "";

  if (pesoAtual > pesoDesejado) {
    exercicios = "🚶 Caminhada, corrida leve, bicicleta.";
    alimentacao = "🥗 Mais legumes, frutas e menos açúcar.";
  } else if (pesoAtual < pesoDesejado) {
    exercicios = "🏋️ Treino de força e resistência.";
    alimentacao = "🍗 Aumentar proteínas e refeições equilibradas.";
  } else {
    exercicios = "✅ Manter rotina de exercícios.";
    alimentacao = "🥑 Manter alimentação saudável.";
  }

  resultado.innerHTML = `
    <strong>IMC:</strong> ${imc}<br><br>
    <strong>Exercícios:</strong> ${exercicios}<br>
    <strong>Alimentação:</strong> ${alimentacao}
  `;
}
</script>

</body>
</html>
