<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://kit.fontawesome.com/a2d9d6b1c6.js" crossorigin="anonymous"></script>

<style>
body {
  background: #0d0d0d;
  color: #fff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 15px;
  padding-bottom: 90px;
}

.card {
  background: #151515;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 20px;
  border: 1px solid #222;
}

h2 {
  margin: 0 0 10px;
}

.btn {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  background: #ffd400;
  color: #000;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}

.day {
  height: 45px;
  border-radius: 10px;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #fff;
}

.day.done {
  color: #00ff6a;
  font-size: 18px;
}

/* MENU INFERIOR */
.bottom-menu {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #000;
  border-top: 1px solid #222;
  display: flex;
  justify-content: space-around;
  padding: 12px 0;
}

.bottom-menu i {
  color: #888;
  font-size: 22px;
}

.bottom-menu i.active {
  color: #ffd400;
}
</style>
</head>

<body>

<div class="card">
  <h2>🎯 Meta</h2>
  <p>Definir corpo</p>
</div>

<div class="card">
  <h2>🍽️ Alimentação do Dia</h2>
  <ul id="food"></ul>
</div>

<div class="card">
  <h2>🔥 Treino VIP do Dia</h2>
  <ul id="workout"></ul>
  <br>
  <button class="btn" onclick="finishDay()">✅ Concluir treino do dia</button>
</div>

<div class="card">
  <h2>📅 Seu progresso</h2>
  <div class="grid" id="days"></div>
</div>

<div class="card">
  <h2>📊 Gráfico de Progresso</h2>
  <canvas id="chart"></canvas>
</div>

<!-- MENU INFERIOR SEM TEXTO -->
<div class="bottom-menu">
  <i class="fas fa-home active"></i>
  <i class="fas fa-dumbbell"></i>
  <i class="fas fa-apple-alt"></i>
  <i class="fas fa-chart-line"></i>
  <i class="fas fa-user"></i>
</div>

<script>
const foods = [
  ["Ovos", "Aveia", "Banana"],
  ["Arroz", "Frango", "Salada"],
  ["Macarrão integral", "Carne", "Legumes"],
  ["Cuscuz", "Ovo", "Fruta"],
  ["Arroz", "Peixe", "Salada"],
  ["Batata doce", "Frango", "Legumes"],
  ["Omelete", "Pão integral", "Fruta"]
];

const workouts = [
  ["Caminhada 30 min", "Polichinelo", "Alongamento"],
  ["Agachamento", "Abdominal", "Prancha"],
  ["Corrida leve", "Flexão", "Alongamento"],
  ["Corda", "Agachamento", "Abdominal"],
  ["Caminhada", "Flexão", "Prancha"],
  ["Bicicleta", "Abdominal", "Alongamento"],
  ["Descanso ativo"]
];

const today = new Date().getDate();
let progress = JSON.parse(localStorage.getItem("progress")) || Array(30).fill(false);

function loadFood() {
  document.getElementById("food").innerHTML =
    foods[today % foods.length].map(i => `<li>${i}</li>`).join("");
}

function loadWorkout() {
  document.getElementById("workout").innerHTML =
    workouts[today % workouts.length].map(i => `<li>${i}</li>`).join("");
}

function loadDays() {
  const c = document.getElementById("days");
  c.innerHTML = "";
  progress.forEach((d, i) => {
    const el = document.createElement("div");
    el.className = "day" + (d ? " done" : "");
    el.innerHTML = d ? "✔️" : i + 1;
    c.appendChild(el);
  });
}

function finishDay() {
  const i = today - 1;
  if (!progress[i]) {
    progress[i] = true;
    localStorage.setItem("progress", JSON.stringify(progress));
    alert("🎉 Parabéns! Você concluiu o dia!");
    loadDays();
    updateChart();
  }
}

let chart;
function updateChart() {
  const ctx = document.getElementById("chart").getContext("2d");
  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [...Array(30)].map((_, i) => i + 1),
      datasets: [{
        data: progress.map(p => p ? 1 : 0),
        borderWidth: 2,
        tension: 0.3
      }]
    },
    options: {
      scales: {
        y: { min: 0, max: 1 }
      }
    }
  });
}

loadFood();
loadWorkout();
loadDays();
updateChart();
</script>

</body>
</html>
