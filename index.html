<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP & Grátis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family: Arial,sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.card{
  background:#151515;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 0 20px rgba(255,255,255,0.05);
}
h2,h3{margin:0 0 10px;}
select,button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button{
  font-weight:bold;
  cursor:pointer;
}
.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}
.progress span{
  display:block;
  height:100%;
}
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.day{
  background:#000;
  border-radius:8px;
  text-align:center;
  padding:10px 0;
  font-size:12px;
}
.box{
  background:#1f1f1f;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  border:1px solid #444;
}
.hidden{display:none;}
.nav{display:flex;gap:10px;margin-bottom:16px;}

.btn-free{
  background:linear-gradient(90deg,#00ff00,#00cc00);
}
.btn-vip{
  background:linear-gradient(90deg,#FFD700,#FFEA00);
}

.vip-card{
  border:3px solid gold;
  box-shadow:0 0 20px gold;
}

.exercise-item{margin:5px 0;}
</style>
</head>

<body>
<div class="container">

<div class="nav">
  <button class="btn-free" onclick="showPage('free')">🆓 Plano Grátis</button>
  <button class="btn-vip" onclick="showPage('vip')">⭐ VIP</button>
</div>

<div class="card">
<h2>🎯 Escolha sua meta</h2>
<select id="goal">
<option value="">Selecione</option>
<option value="emagrecer">Emagrecer</option>
<option value="ganhar">Ganhar massa</option>
<option value="definir">Definir corpo</option>
</select>
</div>

<div id="pageFree" class="card">
<h2>🆓 Plano Grátis</h2>
<div class="box"><div id="foodFree"></div></div>
<div class="box"><div id="workoutFree"></div></div>
</div>

<div id="pageVIP" class="card vip-card hidden">
<h2>⭐ Área VIP</h2>

<div id="vipContent" class="hidden">
<p>Dia <b id="dayCount">1</b>/30</p>
<div class="progress"><span id="bar"></span></div>

<div class="box"><div id="foodVIP"></div></div>
<div class="box">
  <div id="exercisesList"></div>
</div>

<button id="finishBtn">✅ Concluir treino</button>
<button id="resetBtn">🔄 Reiniciar</button>

<div class="grid" id="calendar"></div>
<canvas id="chart"></canvas>
</div>

<button id="unlockBtn" onclick="unlockVIP()">💳 Assinar VIP</button>
</div>

<script>
function showPage(p){
  pageFree.style.display=p==="free"?"block":"none";
  pageVIP.style.display=p==="vip"?"block":"none";
}

const foodFree={
emagrecer:{manha:"🍎 Fruta",tarde:"🥗 Salada",noite:"🍲 Sopa"},
ganhar:{manha:"🥪 Pão + ovos",tarde:"🍛 Arroz + frango",noite:"🥛 Vitamina"},
definir:{manha:"🥣 Aveia",tarde:"🥗 Frango",noite:"🍵 Chá"}
};

const workoutFree={
emagrecer:{manha:"🚶 Caminhada",tarde:"🔥 Polichinelo",noite:"🧘 Alongar"},
ganhar:{manha:"💪 Flexão",tarde:"🏋️ Agachamento",noite:"🧘 Alongar"},
definir:{manha:"🔥 HIIT",tarde:"🏋️ Abdômen",noite:"🧘 Alongar"}
};

const foodVIP={emagrecer:[],ganhar:[],definir:[]};
const workoutVIP={emagrecer:[],ganhar:[],definir:[]};

for(let i=1;i<=30;i++){
foodVIP.emagrecer.push({manha:`Dia ${i} café`,tarde:`Almoço ${i}`,noite:`Jantar ${i}`});
foodVIP.ganhar.push({manha:`Dia ${i} café`,tarde:`Almoço ${i}`,noite:`Jantar ${i}`});
foodVIP.definir.push({manha:`Dia ${i} café`,tarde:`Almoço ${i}`,noite:`Jantar ${i}`});

workoutVIP.emagrecer.push({lista:[`Caminhada ${20+i}min`,`Agachamento 3x15`,`Prancha 30s`]});
workoutVIP.ganhar.push({lista:[`Supino 3x${10+i}`,`Flexão 3x${12+i}`]});
workoutVIP.definir.push({lista:[`HIIT ${10+i}min`,`Abdômen 3x15`]});
}

let vip=localStorage.getItem("vip")==="true";
let doneDays=JSON.parse(localStorage.getItem("doneDays")||"[]");

goal.onchange=loadAll;

function unlockVIP(){
  if(confirm("⭐ Plano VIP\n\nDeseja confirmar o pagamento?")){
    localStorage.setItem("vip","true");
    localStorage.setItem("vipStart",new Date().toISOString());
    vip=true;
    loadAll();
    alert("🎉 VIP liberado!");
  }
}

function loadAll(){
  const g=goal.value;
  if(!g) return;

  foodFreeDiv.innerHTML=JSON.stringify(foodFree[g]);
  workoutFreeDiv.innerHTML=JSON.stringify(workoutFree[g]);

  if(!vip){
    vipContent.classList.add("hidden");
    unlockBtn.style.display="block";
    return;
  }

  vipContent.classList.remove("hidden");
  unlockBtn.style.display="none";

  const day=0;
  foodVIPDiv.innerHTML=JSON.stringify(foodVIP[g][day]);

  exercisesList.innerHTML="";
  workoutVIP[g][day].lista.forEach(ex=>{
    exercisesList.innerHTML+=`<div class="exercise-item">☑ ${ex}</div>`;
  });
}

showPage("free");
</script>
</body>
</html>
