<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  margin:0;
}
.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}
.box{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
.btn-free{background:#2ecc71;color:#fff;}
.btn-vip{background:#f1c40f;color:#000;}
.hidden{display:none;}
.vip-box{
  background:#000;
  color:#f1c40f;
  border:2px solid #f1c40f;
}
ul{padding-left:20px;}
.food-list li{margin-bottom:6px;}
</style>
</head>

<body>
<div class="container">

<div class="box">
<h2>Escolha sua meta</h2>
<select id="meta">
  <option value="">Selecione</option>
  <option value="emagrecer">Emagrecer</option>
  <option value="massa">Ganhar Massa</option>
  <option value="definir">Definir</option>
</select>
</div>

<div class="box">
<button class="btn-free" onclick="mostrarGratis()">Plano Grátis</button>
<button class="btn-vip" onclick="comprarVIP()">Comprar VIP</button>
</div>

<div id="gratis" class="box hidden">
<h3>🔥 Grátis</h3>
<div id="gratisConteudo"></div>
</div>

<div id="vip" class="box vip-box hidden">
<h3>⭐ VIP</h3>
<div id="vipConteudo"></div>
</div>

</div>

<script>
let vipAtivo = localStorage.getItem("vip") === "true";

const dados = {
  emagrecer:{
    gratis:{
      treino:[
        "Manhã: Caminhada 20min",
        "Tarde: Abdominal 3/20",
        "Noite: Agachamento 3/20"
      ],
      comida:[
        "Café: fruta + água",
        "Almoço: arroz + frango",
        "Jantar: salada leve"
      ]
    },
    vip:{
      treino:[
        "Manhã: Caminhada 40min",
        "Tarde: Abdominal 4/25",
        "Noite: HIIT 20min"
      ],
      comida:[
        "Café: ovos + aveia",
        "Almoço: frango + arroz + legumes",
        "Lanche: fruta ou iogurte",
        "Jantar: salada + proteína"
      ]
    }
  },

  massa:{
    gratis:{
      treino:[
        "Manhã: Flexão 3/15",
        "Tarde: Agachamento 3/20",
        "Noite: Prancha 2min"
      ],
      comida:[
        "Café: pão + ovo",
        "Almoço: arroz + carne",
        "Jantar: macarrão simples"
      ]
    },
    vip:{
      treino:[
        "Manhã: Flexão 4/20",
        "Tarde: Agachamento 4/25",
        "Noite: Bíceps + tríceps"
      ],
      comida:[
        "Café: ovos + aveia",
        "Almoço: carne + arroz + feijão",
        "Lanche: vitamina",
        "Jantar: batata doce + frango"
      ]
    }
  },

  definir:{
    gratis:{
      treino:[
        "Manhã: Burpee 3/10",
        "Tarde: Prancha 2min",
        "Noite: Abdominal 3/20"
      ],
      comida:[
        "Café: fruta",
        "Almoço: proteína + legumes",
        "Jantar: refeição leve"
      ]
    },
    vip:{
      treino:[
        "Manhã: HIIT 25min",
        "Tarde: Core completo",
        "Noite: Cardio 30min"
      ],
      comida:[
        "Café: ovos + frutas",
        "Almoço: frango + legumes",
        "Lanche: castanhas",
        "Jantar: proteína leve"
      ]
    }
  }
};

function mostrarGratis(){
  const meta = document.getElementById("meta").value;
  if(!meta){ alert("Escolha a meta"); return; }

  document.getElementById("gratis").classList.remove("hidden");
  let g = dados[meta].gratis;

  document.getElementById("gratisConteudo").innerHTML = `
    <strong>Treino:</strong>
    <ul>${g.treino.map(t=>`<li>${t}</li>`).join("")}</ul>
    <strong>Alimentação:</strong>
    <ul class="food-list">${g.comida.map(c=>`<li>${c}</li>`).join("")}</ul>
  `;
}

function comprarVIP(){
  const meta = document.getElementById("meta").value;
  if(!meta){ alert("Escolha a meta"); return; }

  if(confirm("Confirmar compra do VIP?")){
    vipAtivo = true;
    localStorage.setItem("vip","true");
    mostrarVIP();
  }
}

function mostrarVIP(){
  const meta = document.getElementById("meta").value;
  if(!vipAtivo || !meta) return;

  document.getElementById("vip").classList.remove("hidden");
  let v = dados[meta].vip;

  document.getElementById("vipConteudo").innerHTML = `
    <strong>Treino VIP:</strong>
    <ul>${v.treino.map(t=>`<li>${t}</li>`).join("")}</ul>
    <strong>Alimentação VIP:</strong>
    <ul class="food-list">${v.comida.map(c=>`<li>${c}</li>`).join("")}</ul>
  `;
}

if(vipAtivo){
  mostrarVIP();
}
</script>

</body>
</html>
