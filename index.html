<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #0f9d58, #1b1b1b);
  padding: 20px;
}

.app {
  background: #111;
  color: #fff;
  max-width: 420px;
  margin: auto;
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 15px 30px rgba(0,0,0,.5);
}

h2 {
  text-align: center;
  color: #0f9d58;
}

.tabs {
  display: flex;
  gap: 12px;
  margin: 15px 0;
}

.tabs button {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: #1f1f1f;
  color: #fff;
}

.tabs .active {
  background: #0f9d58;
}

select, button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 14px;
  font-size: 15px;
  border: none;
}

select {
  background: #2a2a2a;
  color: #fff;
}

button {
  background: #0f9d58;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

.vipBox {
  background: linear-gradient(135deg, #2a2400, #111);
  border: 3px solid gold;
  border-radius: 18px;
  padding: 15px;
  margin-top: 10px;
}

ul {
  padding-left: 18px;
}

.calendar span {
  display: inline-block;
  width: 36px;
  height: 36px;
  line-height: 36px;
  margin: 4px;
  border-radius: 50%;
  background: #333;
  font-weight: bold;
}

.calendar .done {
  background: #0f9d58;
}

.success {
  background: #0f9d58;
  padding: 12px;
  border-radius: 12px;
  text-align: center;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">
  <h2>💪 Saúde VIP</h2>

  <div class="tabs">
    <button id="btnGratis" class="active" onclick="abrir('gratis')">🆓 Grátis</button>
    <button id="btnVip" onclick="abrir('vip')">⭐ VIP</button>
  </div>

  <label>🎯 Escolha sua meta</label>
  <select id="meta" onchange="atualizarGratis(); atualizarVipDiario();">
    <option value="">Selecione</option>
    <option value="emagrecer">Emagrecer</option>
    <option value="massa">Ganhar massa</option>
    <option value="definir">Definir corpo</option>
  </select>

  <!-- GRÁTIS -->
  <div id="gratis" class="section active">
    <h3>Treinos Grátis</h3>
    <ul id="treinosGratis"></ul>

    <h3>Alimentação Grátis</h3>
    <ul id="alimentacaoGratis"></ul>
  </div>

  <!-- VIP -->
  <div id="vip" class="section">
    <div class="vipBox">
      <h3>⭐ Treino VIP do Dia</h3>
      <ul id="treinoVipDia"></ul>

      <h3>🥗 Alimentação VIP do Dia</h3>
      <ul id="alimentacaoVipDia"></ul>

      <label>Meta de dias</label>
      <select id="diasMeta" onchange="salvar()">
        <option value="7">7 dias</option>
        <option value="14">14 dias</option>
        <option value="21">21 dias</option>
        <option value="30">30 dias</option>
      </select>

      <p id="progresso"></p>
      <button onclick="concluirTreino()">Concluir treino</button>

      <div class="calendar" id="calendario"></div>

      <div id="mensagem" class="success" style="display:none;">
        🎉 Parabéns! Você concluiu sua meta!
      </div>
    </div>
  </div>
</div>

<script>
const treinosGratis = {
  emagrecer: ["Caminhada", "Abdominal"],
  massa: ["Agachamento", "Flexão"],
  definir: ["Prancha", "Abdominal"]
};

const alimentosGratis = {
  emagrecer: ["Salada", "Ovos"],
  massa: ["Arroz", "Frango"],
  definir: ["Peixe", "Legumes"]
};

const treinosVip = {
  emagrecer: [
    ["Caminhada 30min", "Abdominal", "Agachamento"],
    ["Corrida leve", "Prancha", "Polichinelo"],
    ["Bicicleta", "Abdominal infra"],
    ["Cardio HIIT", "Agachamento"],
    ["Caminhada rápida", "Prancha"]
  ],
  massa: [
    ["Agachamento", "Flexão"],
    ["Afundo", "Flexão"],
    ["Agachamento lento"],
    ["Flexão inclinada"],
    ["Circuito força"]
  ],
  definir: [
    ["Prancha", "Flexão"],
    ["Abdominal", "Prancha lateral"],
    ["Flexão", "Abdominal infra"],
    ["Circuito funcional"],
    ["Prancha", "Abdominal"]
  ]
};

const alimentosVip = {
  emagrecer: [
    ["Ovos", "Salada", "Frango"],
    ["Peixe", "Legumes"],
    ["Omelete", "Fruta"],
    ["Frango", "Legumes"],
    ["Peixe", "Salada"]
  ],
  massa: [
    ["Arroz", "Carne"],
    ["Macarrão", "Frango"],
    ["Arroz", "Ovos"],
    ["Carne", "Batata doce"],
    ["Frango", "Arroz"]
  ],
  definir: [
    ["Peixe", "Legumes"],
    ["Frango", "Salada"],
    ["Ovos", "Legumes"],
    ["Peixe", "Salada"],
    ["Frango", "Ovos"]
  ]
};

let dados = JSON.parse(localStorage.getItem("vipApp")) || {
  meta: "",
  dias: 0,
  diasMeta: 7,
  ultimo: ""
};

function abrir(sec) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(sec).classList.add('active');
  btnGratis.classList.remove("active");
  btnVip.classList.remove("active");
  (sec === "gratis" ? btnGratis : btnVip).classList.add("active");
}

function atualizarGratis() {
  treinosGratisEl.innerHTML = "";
}

function atualizarGratis() {
  treinosGratis.innerHTML = "";
  alimentacaoGratis.innerHTML = "";
  if (!meta.value) return;
  treinosGratis[meta.value].forEach(t => treinosGratis.innerHTML += `<li>${t}</li>`);
  alimentosGratis[meta.value].forEach(a => alimentacaoGratis.innerHTML += `<li>${a}</li>`);
  salvar();
}

function atualizarVipDiario() {
  if (!dados.meta) return;
  const idx = dados.dias % treinosVip[dados.meta].length;
  treinoVipDia.innerHTML = "";
  alimentacaoVipDia.innerHTML = "";
  treinosVip[dados.meta][idx].forEach(t => treinoVipDia.innerHTML += `<li>${t}</li>`);
  alimentosVip[dados.meta][idx].forEach(a => alimentacaoVipDia.innerHTML += `<li>${a}</li>`);
}

function concluirTreino() {
  const hoje = new Date().toDateString();
  if (dados.ultimo === hoje) return alert("Você já concluiu hoje!");
  dados.dias++;
  dados.ultimo = hoje;
  salvar();
  atualizarVip();
  atualizarVipDiario();
}

function atualizarVip() {
  progresso.innerText = `Progresso: ${dados.dias} / ${dados.diasMeta}`;
  calendario.innerHTML = "";
  for (let i = 1; i <= dados.diasMeta; i++) {
    calendario.innerHTML += `<span class="${i <= dados.dias ? 'done':''}">${i}</span>`;
  }
  if (dados.dias >= dados.diasMeta) mensagem.style.display = "block";
}

function salvar() {
  dados.meta = meta.value;
  dados.diasMeta = Number(diasMeta.value);
  localStorage.setItem("vipApp", JSON.stringify(dados));
}

meta.value = dados.meta;
diasMeta.value = dados.diasMeta;
atualizarGratis();
atualizarVip();
atualizarVipDiario();
</script>

</body>
</html>
