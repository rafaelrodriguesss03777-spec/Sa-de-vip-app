<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde & Metas</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:20px;
}

.container{
  max-width:420px;
  margin:auto;
}

/* CARDS */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2,h3{
  margin-top:0;
  text-align:center;
}

/* GRÁTIS */
.free{
  border-left:6px solid #2ecc71;
}

/* VIP */
.vip{
  border-left:6px solid gold;
}

.vip-btn{
  background:linear-gradient(135deg,#FFD700,#C9A300);
  color:#000;
  font-weight:bold;
  border:none;
  padding:12px;
  width:100%;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
}

/* CALENDÁRIO */
.days{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.day{
  background:#eee;
  padding:8px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

.day.active{
  background:#2ecc71;
  color:#fff;
}

/* EXERCÍCIOS */
.exercise{
  background:#f7f7f7;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
}

.exercise h4{
  color:#2c3e50;
  margin:5px 0;
}

.exercise small{
  color:#27ae60;
  font-weight:bold;
}

.exercise button{
  width:100%;
  margin-top:8px;
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.done{
  background:#2ecc71;
  color:#fff;
}

.video{
  background:#3498db;
  color:#fff;
}

/* MOTIVAÇÃO */
.motivacao{
  background:#e8ffe8;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <!-- PLANO GRÁTIS -->
  <div class="card free">
    <h3>🌱 Plano Diário Grátis</h3>
    <p><strong>☀️ Manhã:</strong> Café leve + fruta</p>
    <p><strong>🍽️ Almoço:</strong> Comida equilibrada</p>
    <p><strong>🌙 Noite:</strong> Jantar leve</p>
    <p style="color:gray;font-size:13px">
      🔒 Exercícios completos apenas no VIP
    </p>
  </div>

  <!-- VIP -->
  <div class="card vip">
    <h3>💎 Plano VIP</h3>
    <p style="text-align:center;font-size:14px">
      Escolha seus dias de treino e desbloqueie exercícios personalizados
    </p>

    <div class="days">
      <div class="day" onclick="selectDay(0)">Seg</div>
      <div class="day" onclick="selectDay(1)">Ter</div>
      <div class="day" onclick="selectDay(2)">Qua</div>
      <div class="day" onclick="selectDay(3)">Qui</div>
      <div class="day" onclick="selectDay(4)">Sex</div>
    </div>

    <div id="treino"></div>

    <button class="vip-btn">✨ Desbloquear VIP</button>
  </div>

</div>

<script>
const exercises = [
  ["Agachamento","Flexão","Abdominal"],
  ["Polichinelo","Afundo","Prancha"],
  ["Corrida parada","Flexão joelho","Abdominal bicicleta"],
  ["Agachamento sumô","Escalada","Prancha lateral"],
  ["Burpee","Agachamento","Abdominal"]
];

let doneCount = 0;

function selectDay(day){
  document.querySelectorAll(".day").forEach(d=>d.classList.remove("active"));
  document.querySelectorAll(".day")[day].classList.add("active");

  const treino = document.getElementById("treino");
  treino.innerHTML = "";
  doneCount = 0;

  exercises[day].forEach(ex=>{
    const div = document.createElement("div");
    div.className = "exercise";
    div.innerHTML = `
      <h4>${ex}</h4>
      <small>🔥 Trabalha músculos importantes</small>

      <button class="video">▶ Ver vídeo explicativo</button>
      <button class="done" onclick="markDone(this)">✔ Marcar como feito</button>
    `;
    treino.appendChild(div);
  });
}

function markDone(btn){
  btn.disabled = true;
  btn.innerText = "✅ Concluído";
  doneCount++;

  const total = document.querySelectorAll(".exercise").length;

  if(doneCount === total){
    const msg = document.createElement("div");
    msg.className = "motivacao";
    msg.innerText = "🎉 Parabéns! Você concluiu o treino de hoje! Continue firme 💪";
    document.getElementById("treino").appendChild(msg);
  }
}
</script>

</body>
</html>
