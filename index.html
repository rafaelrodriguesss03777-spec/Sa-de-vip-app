<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0e0e0e;color:#fff}
.container{max-width:420px;margin:auto;padding:16px}
.card{background:#151515;border-radius:16px;padding:16px;margin-bottom:16px}
.vip{border:2px solid gold}
h2,h3{margin:0 0 10px}
select,button{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px}
button{background:gold;color:#000;font-weight:bold;cursor:pointer}
.sec{background:#333;color:#fff}
.box{background:#1f1f1f;padding:12px;border-radius:12px;margin-bottom:12px}
.progress{height:10px;background:#333;border-radius:10px;overflow:hidden;margin-bottom:10px}
.progress span{display:block;height:100%;background:gold}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:#000;color:#fff;border-radius:8px;text-align:center;padding:10px 0;font-size:12px}
.day.done{color:#0f0;font-weight:bold}
.hidden{display:none}
.period{margin-bottom:8px}
.period b{color:gold}
.nav{display:flex;gap:10px;margin-bottom:16px}
</style>
</head>

<body>
<div class="container">

<!-- NAVEGAÇÃO -->
<div class="nav">
<button class="sec" onclick="showPage('free')">🆓 Plano Grátis</button>
<button onclick="showPage('vip')">⭐ VIP</button>
</div>

<!-- META -->
<div class="card">
<h2>🎯 Escolha sua meta</h2>
<select id="goal">
<option value="">Selecione</option>
<option value="emagrecer">Emagrecer</option>
<option value="ganhar">Ganhar massa</option>
<option value="definir">Definir corpo</option>
</select>
</div>

<!-- PÁGINA GRÁTIS -->
<div id="pageFree" class="card">
<h2>🆓 Plano Grátis</h2>

<div class="box">
<h3>🥗 Alimentação</h3>
<div id="foodFree"></div>
</div>

<div class="box">
<h3>🔥 Treino</h3>
<div id="workoutFree"></div>
</div>
</div>

<!-- PÁGINA VIP -->
<div id="pageVIP" class="hidden">
<div class="card vip">
<h2>⭐ VIP</h2>
<p>Dia <b id="dayCount">1</b>/30</p>
<div class="progress"><span id="bar"></span></div>

<div id="vipContent" class="hidden">

<div class="box">
<h3>🥗 Alimentação VIP</h3>
<div id="foodVIP"></div>
</div>

<div class="box">
<h3>🔥 Treino VIP</h3>
<div id="workoutVIP"></div>
</div>

<button onclick="finishDay()">✅ Concluir dia</button>
<button class="sec" onclick="resetProgress()">🔄 Reiniciar 30 dias</button>

<h3 style="margin-top:16px">📅 Progresso</h3>
<div class="grid" id="calendar"></div>

<h3>📊 Gráfico</h3>
<canvas id="chart"></canvas>

</div>

<button id="unlockBtn" onclick="unlockVIP()">🔓 Desbloquear VIP</button>
</div>
</div>

<script>
// ===== NAVEGAÇÃO =====
function showPage(p){
document.getElementById("pageFree").style.display=p==="free"?"block":"none";
document.getElementById("pageVIP").style.display=p==="vip"?"block":"none";
}

// ===== DADOS =====
// GRÁTIS
const foodFree={
emagrecer:{manha:"🍎 Fruta",tarde:"🥗 Salada",noite:"🍲 Sopa"},
ganhar:{manha:"🥪 Pão + ovos",tarde:"🍛 Arroz + frango",noite:"🥛 Vitamina"},
definir:{manha:"🥣 Aveia",tarde:"🥗 Frango",noite:"🍵 Chá"}
};

const workoutFree={
emagrecer:{manha:"🚶 Caminhada",tarde:"🔥 Polichinelo",noite:"🧘 Alongar"},
ganhar:{manha:"💪 Flexão",tarde:"🏋️ Agachamento",noite:"🧘 Alongar"},
definir:{manha:"🔥 HIIT",tarde:"🏋️ Abdômen",noite:"🧘 Alongar"}
};

// VIP: 30 dias completos com 10 refeições e 10 exercícios cada período
function generateVIPData(){
const foodVIP={},workoutVIP={};
const metas=["emagrecer","ganhar","definir"];
metas.forEach(meta=>{
foodVIP[meta]=[];
workoutVIP[meta]=[];
for(let i=1;i<=30;i++){
foodVIP[meta].push({
manha:`🥚 Café ${i} - Ovos, Fruta, Aveia`,
tarde:`🍗 Almoço ${i} - Frango, Arroz, Salada`,
noite:`🌙 Jantar ${i} - Sopa, Legumes, Proteína`
});
workoutVIP[meta].push({
manha:`🚶 Caminhada ${20+i}min, 🏃 Corrida ${10+i}min, 🏋️ Flexão 3x${10+i}`,
tarde:`🔥 Agachamento 3x${10+i}, Burpee 3x${10+i}, Abdominal 3x${10+i}`,
noite:`🧘 Prancha ${30+i}s, Yoga 10min, Alongamento`
});
}
});
return {foodVIP,workoutVIP};
}

const {foodVIP,workoutVIP}=generateVIPData();

// ===== ESTADO =====
let vip=localStorage.getItem("vip")==="true";
let day=Number(localStorage.getItem("day")||1);
let done=JSON.parse(localStorage.getItem("doneDays")||"[]");
let chart=null;

document.getElementById("goal").addEventListener("change",loadAll);

// ===== FUNÇÕES =====
function unlockVIP(){
localStorage.setItem("vip","true");
vip=true;
loadAll();
alert("🎉 VIP desbloqueado!");
}

function loadAll(){
const goal=document.getElementById("goal").value;
if(!goal)return;

// GRÁTIS
document.getElementById("foodFree").innerHTML=
`<div class="period"><b>Manhã:</b> ${foodFree[goal].manha}</div>
<div class="period"><b>Tarde:</b> ${foodFree[goal].tarde}</div>
<div class="period"><b>Noite:</b> ${foodFree[goal].noite}</div>`;

document.getElementById("workoutFree").innerHTML=
`<div class="period"><b>Manhã:</b> ${workoutFree[goal].manha}</div>
<div class="period"><b>Tarde:</b> ${workoutFree[goal].tarde}</div>
<div class="period"><b>Noite:</b> ${workoutFree[goal].noite}</div>`;

if(!vip)return;

// VIP
document.getElementById("vipContent").classList.remove("hidden");
document.getElementById("unlockBtn").style.display="none";

document.getElementById("dayCount").innerText=day;
document.getElementById("bar").style.width=(day/30*100)+"%";

const f=foodVIP[goal][(day-1)%30];
const w=workoutVIP[goal][(day-1)%30];

document.getElementById("foodVIP").innerHTML=
`<div class="period"><b>Manhã:</b> ${f.manha}</div>
<div class="period"><b>Tarde:</b> ${f.tarde}</div>
<div class="period"><b>Noite:</b> ${f.noite}</div>`;

document.getElementById("workoutVIP").innerHTML=
`<div class="period"><b>Manhã:</b> ${w.manha}</div>
<div class="period"><b>Tarde:</b> ${w.tarde}</div>
<div class="period"><b>Noite:</b> ${w.noite}</div>`;

renderCalendar();
renderChart();
}

// ===== DIA =====
function finishDay(){
if(!done.includes(day)){
done.push(day);
localStorage.setItem("doneDays",JSON.stringify(done));
day++; if(day>30)day=30;
localStorage.setItem("day",day);
loadAll();
}
}

function resetProgress(){
day=1;done=[];
localStorage.setItem("day",1);
localStorage.setItem("doneDays","[]");
loadAll();
}

// ===== CALENDÁRIO =====
function renderCalendar(){
const cal=document.getElementById("calendar");
cal.innerHTML="";
for(let i=1;i<=30;i++){
const d=document.createElement("div");
d.className="day"+(done.includes(i)?" done":"");
d.innerHTML=done.includes(i)?"✔️":i;
cal.appendChild(d);
}
}

// ===== GRÁFICO =====
function renderChart(){
const ctx=document.getElementById("chart");
if(chart)chart.destroy();
chart=new Chart(ctx,{
type:"bar",
data:{labels:[...Array(30).keys()].map(i=>i+1),
datasets:[{data:[...Array(30).keys()].map(i=>done.includes(i+1)?1:0),
backgroundColor:"gold"}]},
options:{scales:{y:{min:0,max:1}}}
});
}

// ===== NOTIFICAÇÃO =====
if("Notification" in window){
Notification.requestPermission();
}

showPage("free");
loadAll();
</script>
</body>
</html>
