<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde & Metas</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:20px;
}

.container{
  max-width:420px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2,h3{
  text-align:center;
  margin-top:0;
}

select, button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

.vip{
  border-left:6px solid gold;
}

.vip-btn{
  background:linear-gradient(135deg,#FFD700,#C9A300);
  font-weight:bold;
  border:none;
  cursor:pointer;
}

/* DIAS */
.days{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.day{
  background:#eee;
  padding:8px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

.day.active{
  background:#2ecc71;
  color:#fff;
}

/* EXERCÍCIOS */
.exercise{
  background:#f7f7f7;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
}

.exercise h4{
  margin:5px 0;
  color:#2c3e50;
}

.exercise small{
  color:#27ae60;
  font-weight:bold;
}

.exercise button{
  width:100%;
  margin-top:8px;
  padding:8px;
  border:none;
  border-radius:8px;
}

.done{
  background:#2ecc71;
  color:#fff;
}

.video{
  background:#3498db;
  color:#fff;
}

/* MOTIVAÇÃO */
.motivacao{
  background:#e8ffe8;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  text-align:center;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <!-- ESCOLHA DE META -->
  <div class="card">
    <h3>🎯 Escolha sua meta</h3>
    <select id="meta" onchange="updatePlano()">
      <option value="">Selecione</option>
      <option value="emagrecer">Emagrecer</option>
      <option value="massa">Ganhar Massa</option>
      <option value="definir">Definir Corpo</option>
    </select>
  </div>

  <!-- ALIMENTAÇÃO -->
  <div class="card">
    <h3>🍽️ Alimentação Recomendada</h3>
    <div id="alimentacao">Escolha uma meta</div>
  </div>

  <!-- TREINO VIP -->
  <div class="card vip">
    <h3>🏋️ Treino VIP</h3>

    <div class="days">
      <div class="day" onclick="selectDay(0)">Seg</div>
      <div class="day" onclick="selectDay(1)">Ter</div>
      <div class="day" onclick="selectDay(2)">Qua</div>
      <div class="day" onclick="selectDay(3)">Qui</div>
      <div class="day" onclick="selectDay(4)">Sex</div>
    </div>

    <div id="treino"></div>

    <button class="vip-btn">✨ Desbloquear VIP</button>
  </div>

</div>

<script>
let metaSelecionada = "";
let doneCount = 0;

const alimentacao = {
  emagrecer: `
    ☀️ Café leve (fruta + ovo)<br>
    🍽️ Almoço equilibrado<br>
    🌙 Jantar leve
  `,
  massa: `
    ☀️ Café reforçado (ovos + pão)<br>
    🍽️ Almoço completo<br>
    🌙 Jantar com proteína
  `,
  definir: `
    ☀️ Café equilibrado<br>
    🍽️ Almoço balanceado<br>
    🌙 Jantar leve
  `
};

const treinos = {
  emagrecer: [
    ["Polichinelo","Agachamento","Abdominal"],
    ["Corrida parada","Afundo","Prancha"],
    ["Burpee","Agachamento","Abdominal"],
    ["Escalada","Flexão","Prancha"],
    ["Polichinelo","Agachamento","Abdominal"]
  ],
  massa: [
    ["Agachamento","Flexão","Abdominal"],
    ["Afundo","Flexão","Prancha"],
    ["Agachamento","Flexão","Abdominal"],
    ["Agachamento sumô","Flexão","Prancha"],
    ["Agachamento","Flexão","Abdominal"]
  ],
  definir: [
    ["Agachamento","Prancha","Abdominal"],
    ["Flexão","Abdominal bicicleta","Prancha"],
    ["Agachamento","Flexão","Prancha"],
    ["Escalada","Abdominal","Prancha"],
    ["Agachamento","Flexão","Abdominal"]
  ]
};

function updatePlano(){
  metaSelecionada = document.getElementById("meta").value;
  document.getElementById("alimentacao").innerHTML =
    alimentacao[metaSelecionada] || "Escolha uma meta";
}

function selectDay(day){
  if(!metaSelecionada){
    alert("Escolha a meta primeiro");
    return;
  }

  document.querySelectorAll(".day").forEach(d=>d.classList.remove("active"));
  document.querySelectorAll(".day")[day].classList.add("active");

  const treino = document.getElementById("treino");
  treino.innerHTML = "";
  doneCount = 0;

  treinos[metaSelecionada][day].forEach(ex=>{
    const div = document.createElement("div");
    div.className = "exercise";
    div.innerHTML = `
      <h4>${ex}</h4>
      <small>🔥 Exercício recomendado</small>
      <button class="video">▶ Ver vídeo</button>
      <button class="done" onclick="markDone(this)">✔ Marcar como feito</button>
    `;
    treino.appendChild(div);
  });
}

function markDone(btn){
  btn.disabled = true;
  btn.innerText = "✅ Concluído";
  doneCount++;

  const total = document.querySelectorAll(".exercise").length;
  if(doneCount === total){
    const msg = document.createElement("div");
    msg.className = "motivacao";
    msg.innerText = "🎉 Treino finalizado! Orgulho de você 💪";
    document.getElementById("treino").appendChild(msg);
  }
}
</script>

</body>
</html>
