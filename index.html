<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP & Grátis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{max-width:420px;margin:auto;padding:16px;}
.card{
  background:#151515;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  transition: all 0.3s;
}
h2,h3{margin:0 0 10px;}
select,button{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;cursor:pointer;}
button{transition:all 0.3s;}
button:hover{transform:scale(1.05);}
.box{
  background:#1f1f1f;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  transition:all 0.3s;
}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day{background:#000;color:#fff;border-radius:8px;text-align:center;padding:10px 0;font-size:12px;}
.day.done{color:#0f0;background:#000;font-weight:bold;}
.progress{height:10px;background:#333;border-radius:10px;overflow:hidden;margin-bottom:10px;}
.progress span{display:block;height:100%;background:gold;transition:width 0.5s;}
.nav{display:flex;gap:10px;margin-bottom:16px;}
.hidden{display:none;}

/* VIP */
.vip{
  border:3px solid gold;
  background: linear-gradient(145deg, #1a1a1a, #222);
  box-shadow:0 0 20px gold;
  animation: glowGold 2s infinite alternate;
}
@keyframes glowGold{
  0%{box-shadow:0 0 15px gold;}
  50%{box-shadow:0 0 30px gold;}
  100%{box-shadow:0 0 15px gold;}
}
.vip button{background:gold;color:#000;font-weight:bold;}

/* GRÁTIS */
.free{
  border:3px solid #00ff00;
  background: linear-gradient(145deg,#0a0a0a,#111);
  box-shadow:0 0 20px #00ff00;
  animation: glowGreen 2s infinite alternate;
}
@keyframes glowGreen{
  0%{box-shadow:0 0 15px #00ff00;}
  50%{box-shadow:0 0 30px #00ff00;}
  100%{box-shadow:0 0 15px #00ff00;}
}
.free button{background:#00ff00;color:#000;font-weight:bold;}
</style>
</head>
<body>
<div class="container">

<!-- Navegação páginas -->
<div class="nav">
<button onclick="showPage('free')" style="background:#00ff00;color:#000;font-weight:bold;">🆓 Plano Grátis</button>
<button onclick="showPage('vip')" style="background:gold;color:#000;font-weight:bold;">⭐ VIP</button>
</div>

<!-- Meta -->
<div class="card">
<h2>🎯 Escolha sua meta</h2>
<select id="goal">
<option value="">Selecione</option>
<option value="emagrecer">Emagrecer</option>
<option value="ganhar">Ganhar massa</option>
<option value="definir">Definir corpo</option>
</select>
</div>

<!-- Plano Grátis -->
<div id="pageFree" class="card free">
<h2>🆓 Plano Grátis</h2>
<div class="box">
<h3>🥗 Alimentação</h3>
<div id="foodFree"></div>
</div>
<div class="box">
<h3>🔥 Treino</h3>
<div id="workoutFree"></div>
</div>
</div>

<!-- VIP -->
<div id="pageVIP" class="hidden">
<div class="card vip">
<h2>⭐ VIP</h2>
<p>Dia <b id="dayCount">1</b>/30</p>
<div class="progress"><span id="bar"></span></div>

<div id="vipContent" class="hidden">
<div class="box">
<h3>🥗 Alimentação VIP do Dia</h3>
<div id="foodVIP"></div>
</div>
<div class="box">
<h3>🔥 Treino VIP do Dia</h3>
<div id="workoutVIP"></div>
</div>
<button id="finishBtn">✅ Concluir treino do dia</button>
<button id="resetBtn">🔄 Reiniciar 30 dias</button>

<h3 style="margin-top:16px;">📅 Progresso</h3>
<div class="grid" id="calendar"></div>
<h3 style="margin-top:16px;">📊 Gráfico</h3>
<canvas id="chart"></canvas>
</div>

<button id="unlockBtn" onclick="unlockVIP()">🔓 Desbloquear VIP</button>
</div>
</div>

<script>
// Navegação páginas
function showPage(p){
  document.getElementById("pageFree").style.display = p==="free"?"block":"none";
  document.getElementById("pageVIP").style.display = p==="vip"?"block":"none";
}

// Dados Grátis
const foodFree={
  emagrecer:{manha:"🍎 Fruta",tarde:"🥗 Salada",noite:"🍲 Sopa"},
  ganhar:{manha:"🥪 Pão + ovos",tarde:"🍛 Arroz + frango",noite:"🥛 Vitamina"},
  definir:{manha:"🥣 Aveia",tarde:"🥗 Frango",noite:"🍵 Chá"}
};
const workoutFree={
  emagrecer:{manha:"🚶 Caminhada",tarde:"🔥 Polichinelo",noite:"🧘 Alongar"},
  ganhar:{manha:"💪 Flexão",tarde:"🏋️ Agachamento",noite:"🧘 Alongar"},
  definir:{manha:"🔥 HIIT",tarde:"🏋️ Abdômen",noite:"🧘 Alongar"}
};

// Dados VIP progressivo
const baseWorkoutVIP={
  emagrecer:[
    ["🚶 Caminhada 20min","🔥 Polichinelo 3x10","🧘 Alongamento 5min"],
    ["🚶 Caminhada 25min","🔥 Polichinelo 3x12","🧘 Alongamento 7min"],
    ["🚶 Caminhada 30min","🔥 Polichinelo 3x15","🧘 Alongamento 10min"],
    ["🚶 Caminhada 35min","🔥 Polichinelo 3x18","🧘 Alongamento 12min"]
  ],
  ganhar:[
    ["🏋️ Supino 3x10","🏋️ Agachamento 3x10","🧘 Prancha 30s"],
    ["🏋️ Supino 3x12","🏋️ Agachamento 3x12","🧘 Prancha 40s"],
    ["🏋️ Supino 3x15","🏋️ Agachamento 3x15","🧘 Prancha 50s"],
    ["🏋️ Supino 3x18","🏋️ Agachamento 3x18","🧘 Prancha 60s"]
  ],
  definir:[
    ["🔥 HIIT 3x10","🏋️ Abdômen 3x10","🧘 Yoga 5min"],
    ["🔥 HIIT 3x12","🏋️ Abdômen 3x12","🧘 Yoga 7min"],
    ["🔥 HIIT 3x15","🏋️ Abdômen 3x15","🧘 Yoga 10min"],
    ["🔥 HIIT 3x18","🏋️ Abdômen 3x18","🧘 Yoga 12min"]
  ]
};

// Estado VIP
let vip = localStorage.getItem("vip")==="true";
let doneDays = JSON.parse(localStorage.getItem("doneDays")||"[]");
let chart = null;

// Eventos
document.getElementById("goal").addEventListener("change",loadAll);
document.getElementById("finishBtn").addEventListener("click",finishDay);
document.getElementById("resetBtn").addEventListener("click",resetProgress);

function unlockVIP(){
  localStorage.setItem("vip","true");
  vip=true;
  alert("🎉 VIP desbloqueado!");
  loadAll();
}

// Dia atual baseado no progresso
function getCurrentDayIndex(){
  let startDate = new Date(localStorage.getItem("vipStart")||new Date().toISOString());
  if(!localStorage.getItem("vipStart")) localStorage.setItem("vipStart",startDate);
  let today = new Date();
  let diff = Math.floor((today-startDate)/(1000*60*60*24));
  return Math.min(diff,29);
}

// Carrega dados
function loadAll(){
  const goal = document.getElementById("goal").value;
  if(!goal) return;

  // Grátis
  document.getElementById("foodFree").innerHTML=
  `<b>Manhã:</b> ${foodFree[goal].manha}<br>
   <b>Tarde:</b> ${foodFree[goal].tarde}<br>
   <b>Noite:</b> ${foodFree[goal].noite}`;
  document.getElementById("workoutFree").innerHTML=
  `<b>Manhã:</b> ${workoutFree[goal].manha}<br>
   <b>Tarde:</b> ${workoutFree[goal].tarde}<br>
   <b>Noite:</b> ${workoutFree[goal].noite}`;

  // VIP
  if(!vip) return;
  document.getElementById("vipContent").classList.remove("hidden");
  document.getElementById("unlockBtn").style.display="none";

  const dayIndex = getCurrentDayIndex();
  document.getElementById("dayCount").innerText = dayIndex+1;
  document.getElementById("bar").style.width = ((dayIndex+1)/30*100)+"%";

  const fVIP = baseWorkoutVIP[goal][Math.min(dayIndex,3)]; // progressivo
  document.getElementById("foodVIP").innerHTML=
  `<b>Manhã:</b> ${fVIP[0]}<br>
   <b>Tarde:</b> ${fVIP[1]}<br>
   <b>Noite:</b> ${fVIP[2]}`;
  document.getElementById("workoutVIP").innerHTML=
  `<b>Manhã:</b> ${fVIP[0]}<br>
   <b>Tarde:</b> ${fVIP[1]}<br>
   <b>Noite:</b> ${fVIP[2]}`;

  renderCalendar();
  renderChart();
}

// Concluir dia
function finishDay(){
  const todayIndex = getCurrentDayIndex()+1;
  if(doneDays.includes(todayIndex)) return alert("✅ Você já concluiu os exercícios de hoje!");
  doneDays.push(todayIndex);
  localStorage.setItem("doneDays",JSON.stringify(doneDays));
  alert("✅ Exercícios do dia concluídos!");
  loadAll();
}

// Reset VIP
function resetProgress(){
  localStorage.removeItem("vipStart");
  doneDays=[];
  localStorage.setItem("doneDays","[]");
  loadAll();
}

// Calendário
function renderCalendar(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  for(let i=1;i<=30;i++){
    const d=document.createElement("div");
    d.className="day";
    d.innerText = doneDays.includes(i)?"✅":i;
    cal.appendChild(d);
  }
}

// Gráfico
function renderChart(){
  const ctx=document.getElementById("chart");
  if(chart) chart.destroy();
  chart = new Chart(ctx,{
    type:"bar",
    data:{
      labels:[...Array(30).keys()].map(i=>i+1),
      datasets:[{data:[...Array(30).keys()].map(i=>doneDays.includes(i+1)?1:0),backgroundColor:"gold"}]
    },
    options:{scales:{y:{min:0,max:1}}}
  });
}

// Inicial
showPage("free");
loadAll();
</script>
</body>
</html>
