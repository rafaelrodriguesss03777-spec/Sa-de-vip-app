<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saúde VIP</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  margin:0;
}
.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}
.section{
  background:#fff;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 6px 14px rgba(0,0,0,.12);
}
.tabs{
  display:flex;
}
.tab{
  flex:1;
  padding:10px;
  text-align:center;
  cursor:pointer;
  border-bottom:3px solid transparent;
}
.tab.active{
  background:#000;
  color:#FFD700;
  font-weight:bold;
  border-bottom:3px solid #FFD700;
}
.card{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  box-shadow:0 3px 8px rgba(0,0,0,.15);
}
.vip{
  background:linear-gradient(135deg,#000,#1a1a1a);
  color:#FFD700;
  border:2px solid #FFD700;
  box-shadow:0 0 18px rgba(255,215,0,.6);
  animation: glow 2s infinite alternate;
}
@keyframes glow{
  from{ box-shadow:0 0 10px rgba(255,215,0,.4); }
  to{ box-shadow:0 0 25px rgba(255,215,0,.9); }
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  margin-top:10px;
  font-weight:bold;
  font-size:15px;
}
.btnVip{
  background:#FFD700;
  color:#000;
}
.done{
  background:#d4edda;
  color:green;
  text-align:center;
}
select{
  width:100%;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>
<div class="container">

<div class="section">
<h3>🎯 Escolha sua meta</h3>
<select id="goal">
  <option value="">Selecione</option>
  <option value="emagrecer">Emagrecer</option>
  <option value="massa">Ganhar massa</option>
  <option value="definir">Definir</option>
</select>
</div>

<div class="section">
<div class="tabs">
  <div class="tab active" onclick="openTab('free')">Grátis</div>
  <div class="tab" onclick="openTab('vip')">VIP ⭐</div>
</div>

<!-- GRATIS -->
<div id="free">
<h3>🍽️ Alimentação Grátis</h3>
<div class="card" id="foodFree">Selecione a meta</div>

<h3>💪 Treino Grátis</h3>
<div id="trainFree"></div>
</div>

<!-- VIP -->
<div id="vip" style="display:none">
<h3>📆 Progresso VIP</h3>
<div class="card" id="progress">Dia - /30</div>

<h3>🍽️ Alimentação VIP</h3>
<div id="foodVIP" class="card vip">🔒 Compre o VIP para ver</div>

<h3>💪 Treino VIP</h3>
<div id="trainVIP" class="card vip">🔒 Compre o VIP para ver</div>

<button class="btnVip" onclick="completeDay()" id="doneBtn" disabled>
✅ Concluir treino do dia
</button>

<div id="msg"></div>

<button class="btnVip" onclick="buyVIP()">💰 Comprar VIP (Pix)</button>
<button onclick="unlockVIP()">✅ Já paguei – liberar VIP</button>
</div>
</div>
</div>

<script>
let vip = localStorage.getItem("vip")==="true";
let day = Number(localStorage.getItem("day")) || 1;

const freeData={
  emagrecer:{food:"Frutas, ovos e salada",train:["Caminhada 15min","Agachamento 2/15"]},
  massa:{food:"Arroz, ovo e frango",train:["Flexão 2/10","Agachamento 2/15"]},
  definir:{food:"Proteína e legumes",train:["Prancha 2/30s","Abdominal 2/20"]}
};

function vipFood(d){
return `
<b>☀️ Café da manhã</b><br>
Ovo + fruta<br><br>

<b>🍛 Almoço</b><br>
Frango + arroz + salada<br><br>

<b>🍎 Lanche</b><br>
Fruta ou iogurte<br><br>

<b>🌙 Jantar</b><br>
Proteína leve + legumes<br><br>

<small>📆 Dia ${d} do plano VIP</small>`;
}

function vipTrain(d){
return `
<b>🌅 Manhã</b><br>
Caminhada ${20+d} min<br><br>

<b>🌞 Tarde</b><br>
Agachamento 3/${12+d}<br>
Flexão 3/${10+d}<br><br>

<b>🌙 Noite</b><br>
Abdominal 3/${15+d}<br>
Prancha 2/${30+d}s`;
}

function openTab(tab){
free.style.display=tab==="free"?"block":"none";
vipDiv.style.display=tab==="vip"?"block":"none";
}

goal.onchange=load;

function load(){
const g=goal.value;
if(!g)return;

foodFree.innerHTML=freeData[g].food;
trainFree.innerHTML="";
freeData[g].train.forEach(t=>{
trainFree.innerHTML+=`<div class="card">${t}</div>`;
});

if(vip){
foodVIP.innerHTML=vipFood(day);
trainVIP.innerHTML=vipTrain(day);
progress.innerHTML=`Dia ${day}/30`;
doneBtn.disabled=false;
}
}

function buyVIP(){
alert("Pagamento Pix\nChave: SEU-PIX-AQUI");
}

function unlockVIP(){
vip=true;
localStorage.setItem("vip","true");
alert("VIP liberado com sucesso!");
load();
}

function completeDay(){
msg.innerHTML=`<div class="card done">🔥 Parabéns! Meta concluída.<br>Volte amanhã!</div>`;
day++;
if(day>30)day=30;
localStorage.setItem("day",day);
load();
}

const free=document.getElementById("free");
const vipDiv=document.getElementById("vip");
load();
</script>

</body>
</html>
