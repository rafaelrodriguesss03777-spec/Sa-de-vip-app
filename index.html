<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP & Grátis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
  margin:0;
  font-family: Arial,sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.card{
  background:#151515;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 0 20px rgba(255,255,255,0.05);
}
h2,h3{margin:0 0 10px;}
select,button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button{
  font-weight:bold;
  cursor:pointer;
}
.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}
.progress span{
  display:block;
  height:100%;
}
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.day{
  background:#000;
  border-radius:8px;
  text-align:center;
  padding:10px 0;
  font-size:12px;
}
.box{
  background:#1f1f1f;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  border:1px solid #444;
}
.hidden{display:none;}
.nav{display:flex;gap:10px;margin-bottom:16px;}
.btn-free{background:#00ff00;color:#000;}
.btn-vip{background:#FFD700;color:#000;}
.vip-card{
  border:3px solid gold;
  box-shadow:0 0 20px gold;
}
.exercise-item{margin:6px 0;}
</style>
</head>
<body>

<div class="container">

<div class="nav">
  <button class="btn-free" onclick="showPage('free')">🆓 Grátis</button>
  <button class="btn-vip" onclick="showPage('vip')">⭐ VIP</button>
</div>

<div class="card">
<h2>🎯 Meta</h2>
<select id="goal">
<option value="">Selecione</option>
<option value="emagrecer">Emagrecer</option>
<option value="ganhar">Ganhar massa</option>
<option value="definir">Definir corpo</option>
</select>
</div>

<div id="pageFree" class="card">
<h2>🆓 Plano Grátis</h2>
<div class="box" id="foodFree"></div>
<div class="box" id="workoutFree"></div>
</div>

<div id="pageVIP" class="card vip-card hidden">
<h2>⭐ VIP</h2>

<div class="box">
<h3>👤 Gênero</h3>
<select id="gender">
<option value="masc">Masculino</option>
<option value="fem">Feminino</option>
</select>

<h3>⚡ Dificuldade</h3>
<select id="difficulty">
<option value="facil">Fácil</option>
<option value="medio">Médio</option>
<option value="dificil">Difícil</option>
</select>
</div>

<p>Dia <b id="dayCount">1</b>/30</p>
<div class="progress"><span id="bar"></span></div>

<div id="vipContent" class="hidden">
<div class="box" id="foodVIP"></div>
<div class="box">
<h3>🔥 Exercícios</h3>
<div id="exercisesList"></div>
</div>

<button id="finishBtn">✅ Concluir</button>
<div class="grid" id="calendar"></div>
<canvas id="chart"></canvas>
</div>

<button id="unlockBtn">🔒 Desbloquear VIP</button>
</div>
</div>

<script>
function showPage(p){
  pageFree.style.display=p==="free"?"block":"none";
  pageVIP.style.display=p==="vip"?"block":"none";
}

const vip = localStorage.getItem("vip")==="true";

unlockBtn.onclick=()=>{
  alert("💳 Área VIP paga manualmente");
  localStorage.setItem("vip","true");
  location.reload();
};

const workouts={
facil:{serie:2,rep:10},
medio:{serie:3,rep:12},
dificil:{serie:4,rep:15}
};

function loadVIP(){
 if(!localStorage.getItem("vip")) return;
 vipContent.classList.remove("hidden");
 unlockBtn.style.display="none";

 const diff=difficulty.value;
 const w=workouts[diff];

 exercisesList.innerHTML="";
 ["Agachamento","Flexão","Abdominal"].forEach(e=>{
   exercisesList.innerHTML+=`
   <div class="exercise-item">
   ${e} – ${w.serie}x${w.rep}
   </div>`;
 });
}

difficulty.onchange=loadVIP;
gender.onchange=loadVIP;

showPage("free");
</script>
</body>
</html>
