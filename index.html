<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.card{
  background:#151515;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}
h2,h3{margin-bottom:10px}

/* NAV */
.nav{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}
.btn-free{
  flex:1;
  background:#0f3;
  color:#000;
  font-weight:bold;
  border:none;
  padding:14px;
  border-radius:12px;
  box-shadow:0 0 15px #0f3;
}
.btn-vip{
  flex:1;
  background:linear-gradient(90deg,#FFD700,#FFEA00);
  color:#000;
  font-weight:bold;
  border:none;
  padding:14px;
  border-radius:12px;
  box-shadow:0 0 15px gold;
}

/* VIP */
.vip{
  border:2px solid gold;
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 10px gold}
  50%{box-shadow:0 0 25px gold}
  100%{box-shadow:0 0 10px gold}
}

select,button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:16px;
  margin-bottom:10px;
}
button.gold{
  background:linear-gradient(90deg,#FFD700,#FFEA00);
  color:#000;
  font-weight:bold;
}
button.sec{
  background:#333;
  color:#fff;
}

.box{
  background:#1f1f1f;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}

.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
}
.progress span{
  display:block;
  height:100%;
  background:gold;
}

.hidden{display:none}
</style>
</head>

<body>
<div class="container">

<!-- NAVEGAÇÃO -->
<div class="nav">
  <button class="btn-free" onclick="showPage('free')">🆓 Plano Grátis</button>
  <button class="btn-vip" onclick="showPage('vip')">⭐ VIP</button>
</div>

<!-- META -->
<div class="card">
<h2>🎯 Escolha sua meta</h2>
<select id="goal">
<option value="">Selecione</option>
<option value="emagrecer">Emagrecer</option>
<option value="ganhar">Ganhar massa</option>
<option value="definir">Definir corpo</option>
</select>
</div>

<!-- GRÁTIS -->
<div id="pageFree" class="card">
<h2>🆓 Plano Grátis</h2>
<div class="box" id="freeContent">Escolha uma meta</div>
</div>

<!-- VIP -->
<div id="pageVIP" class="card vip hidden">
<h2>⭐ VIP Premium</h2>

<h3>👤 Gênero</h3>
<select id="gender">
<option value="">Selecione</option>
<option value="homem">Homem</option>
<option value="mulher">Mulher</option>
</select>

<p>Dia <b id="dayCount">1</b>/30</p>
<div class="progress"><span id="bar"></span></div>

<div class="box">
<h3>🥗 Alimentação</h3>
<div id="foodVIP"></div>
</div>

<div class="box">
<h3>🔥 Treino do Dia</h3>
<div id="workoutVIP"></div>
</div>

<button class="gold" onclick="finishDay()">✅ Concluir treino do dia</button>
<button class="gold" onclick="reset30()">🔄 Reiniciar 30 dias</button>
</div>

</div>

<script>
/* NAVEGAÇÃO */
function showPage(p){
document.getElementById("pageFree").style.display=p==="free"?"block":"none";
document.getElementById("pageVIP").style.display=p==="vip"?"block":"none";
}

/* ESTADO */
let doneDays = JSON.parse(localStorage.getItem("doneDays")||"[]");
let start = localStorage.getItem("vipStart");
let genderSel = localStorage.getItem("gender");

/* SALVAR GÊNERO */
document.getElementById("gender").value = genderSel || "";
document.getElementById("gender").addEventListener("change",e=>{
  localStorage.setItem("gender",e.target.value);
  loadVIP();
});

/* DIA ATUAL */
function dayIndex(){
if(!start){
start=new Date().toISOString();
localStorage.setItem("vipStart",start);
}
return Math.min(
Math.floor((new Date()-new Date(start))/(1000*60*60*24)),29);
}

/* DADOS */
function workoutVIP(goal,day,gender){
let base = gender==="homem"? day+10 : day+5;
if(goal==="emagrecer")
return `Caminhada ${20+base} min<br>Agachamento ${10+base}x<br>Polichinelo ${15+base}x`;
if(goal==="ganhar")
return `Flexão ${8+base}x<br>Agachamento ${10+base}x<br>Prancha ${20+base}s`;
return `HIIT ${10+base} min<br>Abdômen ${12+base}x`;
}

function foodVIP(goal){
if(goal==="emagrecer") return "Frutas • Frango • Legumes";
if(goal==="ganhar") return "Ovos • Arroz • Carne";
return "Aveia • Frango • Salada";
}

/* LOAD */
document.getElementById("goal").addEventListener("change",loadVIP);

function loadVIP(){
let goal=document.getElementById("goal").value;
if(!goal) return;

let d=dayIndex();
document.getElementById("dayCount").innerText=d+1;
document.getElementById("bar").style.width=((d+1)/30*100)+"%";

document.getElementById("foodVIP").innerHTML=foodVIP(goal);

if(!genderSel) return;
document.getElementById("workoutVIP").innerHTML=
workoutVIP(goal,d,localStorage.getItem("gender"));
}

/* CONCLUIR */
function finishDay(){
let d=dayIndex()+1;
if(doneDays.includes(d)) return alert("Dia já concluído");
doneDays.push(d);
localStorage.setItem("doneDays",JSON.stringify(doneDays));
alert("✅ Dia concluído!");
}

/* RESET */
function reset30(){
localStorage.removeItem("vipStart");
doneDays=[];
localStorage.setItem("doneDays","[]");
alert("🔄 Reiniciado");
}

showPage("free");
</script>
</body>
</html>
