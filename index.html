<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP & Grátis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.card{
  background:#151515;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 0 20px rgba(255,255,255,0.05);
}
h2,h3{
  margin:0 0 10px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition: transform 0.2s, box-shadow 0.3s;
}
button:hover{
  transform: scale(1.05);
  box-shadow:0 0 15px currentColor;
}
.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}
.progress span{
  display:block;
  height:100%;
}
.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.day{
  padding:10px 0;
  background:#222;
  border-radius:8px;
  text-align:center;
  font-size:12px;
  color:#fff;
}
.day.done{
  background:green;
  color:#000;
  font-weight:bold;
}
.hidden{display:none;}
.box{
  background:#1f1f1f;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}

/* VIP */
.vip{
  border:3px solid gold;
  background: linear-gradient(145deg, #1a1a1a, #222);
  box-shadow: 0 0 20px gold;
  animation: glowGold 2s infinite alternate;
  position: relative;
}
@keyframes glowGold {
  0% { box-shadow:0 0 15px gold; }
  50% { box-shadow:0 0 30px gold; }
  100% { box-shadow:0 0 15px gold; }
}
.vip button{ background:gold; color:#000; }

/* GRÁTIS */
.free{
  border:3px solid #00ff00;
  background: linear-gradient(145deg, #0a0a0a, #111);
  box-shadow: 0 0 20px #00ff00;
  animation: glowGreen 2s infinite alternate;
}
@keyframes glowGreen {
  0% { box-shadow:0 0 15px #00ff00; }
  50% { box-shadow:0 0 30px #00ff00; }
  100% { box-shadow:0 0 15px #00ff00; }
}
.free button{ background:#00ff00; color:#000; }
</style>
</head>

<body>
<div class="container">

  <!-- META -->
  <div class="card">
    <h2>🎯 Escolha sua meta</h2>
    <select id="goal" style="width:100%;padding:12px;border-radius:10px;">
      <option value="">Selecione</option>
      <option value="emagrecer">Emagrecer</option>
      <option value="ganhar">Ganhar massa</option>
      <option value="definir">Definir corpo</option>
    </select>
  </div>

  <!-- GRÁTIS -->
  <div class="card free">
    <h2>🍀 Plano Grátis</h2>
    <div class="box">
      <h3>🥗 Alimentação do Dia</h3>
      <div id="foodFree"></div>
    </div>
    <div class="box">
      <h3>🔥 Treino do Dia</h3>
      <div id="workoutFree"></div>
    </div>
  </div>

  <!-- VIP -->
  <div class="card vip">
    <h2>⭐ VIP</h2>
    <p>Dia <b id="dayCount">1</b>/30</p>
    <div class="progress"><span id="bar"></span></div>

    <div id="vipContent" class="hidden">

      <div class="box">
        <h3>🥗 Alimentação VIP do Dia</h3>
        <div id="food"></div>
      </div>

      <div class="box">
        <h3>🔥 Treino VIP do Dia</h3>
        <div id="workout"></div>
      </div>

      <button onclick="finishDay()">✅ Concluir treino do dia</button>

      <h3 style="margin-top:16px;">📅 Seu progresso</h3>
      <div class="grid" id="calendar"></div>

      <h3>📊 Gráfico de Progresso</h3>
      <canvas id="chart"></canvas>

    </div>

    <button id="unlockBtn" onclick="unlockVIP()">🔓 Desbloquear VIP</button>
  </div>

</div>

<script>
// ====== DADOS ======
const foods = {
  emagrecer:[
    ["🍳 Ovos","🥗 Frango grelhado","🌙 Salada leve"],
    ["🥣 Aveia","🐟 Peixe","🌙 Sopa detox"],
    ["🍞 Pão integral","🥗 Salada proteica","🌙 Omelete"]
  ],
  ganhar:[
    ["🥞 Panqueca","🍛 Arroz + frango","🌙 Vitamina"],
    ["🥣 Aveia + banana","🍝 Macarrão","🌙 Ovos"],
    ["🍞 Pão + ovos","🍛 Carne","🌙 Shake"]
  ],
  definir:[
    ["🍳 Ovos mexidos","🥗 Salada + frango","🌙 Peixe grelhado"],
    ["🥣 Smoothie","🍝 Macarrão integral","🌙 Omelete"],
    ["🍞 Pão integral","🥗 Salada proteica","🌙 Frango grelhado"]
  ]
};

const workouts = {
  emagrecer:[
    ["🚶 Caminhada 30min","🔥 Polichinelo 3x15","🧘 Alongamento 5min"],
    ["🚴 Bike 20min","🔥 Agachamento 3x12","🧘 Prancha 30s"],
    ["🏃 Corrida leve 25min","🔥 Burpee 3x10","🧘 Yoga 10min"]
  ],
  ganhar:[
    ["🏋️ Peito 3x12","💪 Flexão 3x15","🧘 Alongamento 5min"],
    ["🏋️ Pernas 3x12","💪 Agachamento 3x15","🧘 Prancha 30s"],
    ["🏋️ Braços 3x12","💪 Rosca 3x12","🧘 Alongamento 5min"]
  ],
  definir:[
    ["🚶 Caminhada 20min","🔥 Abdominal 3x20","🧘 Prancha 1min"],
    ["🚶 Corrida 20min","🔥 Flexão 3x12","🧘 Yoga 10min"],
    ["🚴 Bike 15min","🔥 Burpee 3x10","🧘 Alongamento 5min"]
  ]
};

// ====== GRÁTIS ======
function loadFree(){
  const goal=document.getElementById("goal").value;
  if(!goal) return;
  const f = foods[goal][0];
  const w = workouts[goal][0];
  document.getElementById("foodFree").innerHTML=f.join("<br>");
  document.getElementById("workoutFree").innerHTML=w.join("<br>");
}

// ====== VIP ======
let vip = localStorage.getItem("vip")==="true";
let day = Number(localStorage.getItem("day")||1);
let doneDays = JSON.parse(localStorage.getItem("doneDays")||"[]");
let progressChart = null;

function unlockVIP(){
  localStorage.setItem("vip","true");
  vip=true;
  alert("🎉 VIP desbloqueado!");
  loadVIP();
}

function loadVIP(){
  if(!vip) return;
  const goal = document.getElementById("goal").value;
  if(!goal) return;
  document.getElementById("vipContent").classList.remove("hidden");
  document.getElementById("unlockBtn").style.display="none";

  document.getElementById("dayCount").innerText=day;
  document.getElementById("bar").style.width=(day/30*100)+"%";

  const f = foods[goal][(day-1)%foods[goal].length];
  const w = workouts[goal][(day-1)%workouts[goal].length];

  document.getElementById("food").innerHTML=f.join("<br>");
  document.getElementById("workout").innerHTML=w.join("<br>");

  renderCalendar();
  renderChart();
  dailyNotification();
}

function finishDay(){
  if(!doneDays.includes(day)){
    doneDays.push(day);
    localStorage.setItem("doneDays",JSON.stringify(doneDays));
    alert("🎉 Parabéns! Dia concluído!");
    day++;
    if(day>30) day=1;
    localStorage.setItem("day",day);
    loadVIP();
  }
}

function renderCalendar(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  for(let i=1;i<=30;i++){
    const d=document.createElement("div");
    if(doneDays.includes(i)){
      d.className="day done";
      d.innerText="✔️";
    } else {
      d.className="day";
      d.innerText=i;
    }
    cal.appendChild(d);
  }
}

function renderChart(){
  const ctx=document.getElementById("chart");
  if(progressChart) progressChart.destroy();
  progressChart = new Chart(ctx,{
    type:"line",
    data:{
      labels:Array.from({length:30},(_,i)=>i+1),
      datasets:[{
        label:"Dias concluídos",
        data:Array.from({length:30},(_,i)=>doneDays.includes(i)?1:0),
        borderColor:"gold",
        backgroundColor:"rgba(255,215,0,0.2)",
        tension:0.4
      }]
    },
    options:{ scales:{ y:{ min:0,max:1,ticks:{ stepSize:1 } } } }
  });
}

function dailyNotification(){
  if(!vip) return;
  if(!("Notification" in window)) return;
  Notification.requestPermission().then(p=>{
    if(p==="granted"){
      const today=new Date().toDateString();
      if(localStorage.getItem("lastNotify")!==today){
        new Notification("💪 Hora do treino VIP!",{ body:"Conclua seu treino de hoje!" });
        localStorage.setItem("lastNotify",today);
      }
    }
  });
}

document.getElementById("goal").addEventListener("change",()=>{
  loadFree();
  loadVIP();
});

loadFree();
loadVIP();
</script>
</body>
</html>
