<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Saúde VIP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0e0e0e;
  color:#fff;
}
.container{
  max-width:420px;
  margin:auto;
  padding:16px;
}
.card{
  background:#151515;
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}
.vip{
  border:2px solid gold;
}
h2,h3{
  margin:0 0 10px;
}
select,button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:15px;
}
button{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}
.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}
.progress span{
  height:100%;
  display:block;
  background:gold;
}
.box{
  background:#1f1f1f;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}
.hidden{display:none;}

.grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.day{
  background:#000;
  border-radius:8px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:13px;
}
.day.done{
  background:#000;
  color:#00ff66;
  font-size:18px;
}
</style>
</head>

<body>
<div class="container">

<!-- META -->
<div class="card">
  <h2>🎯 Escolha sua meta</h2>
  <select id="goal">
    <option value="">Selecione</option>
    <option value="emagrecer">Emagrecer</option>
    <option value="ganhar">Ganhar massa</option>
    <option value="definir">Definir corpo</option>
  </select>
</div>

<!-- VIP -->
<div class="card vip">
  <h2>⭐ VIP</h2>
  <p>Dia <b id="dayCount">1</b>/30</p>
  <div class="progress"><span id="bar"></span></div>

  <div id="vipContent" class="hidden">

    <div class="box">
      <h3>🥗 Alimentação VIP do dia</h3>
      <div id="food"></div>
    </div>

    <div class="box">
      <h3>🔥 Treino VIP do dia</h3>
      <div id="workout"></div>
    </div>

    <button onclick="finishDay()">✅ Concluir dia</button>

    <h3 style="margin-top:14px;">📅 Progresso</h3>
    <div class="grid" id="calendar"></div>

    <h3>📊 Gráfico</h3>
    <canvas id="chart"></canvas>

  </div>

  <button id="unlockBtn" onclick="unlockVIP()">🔓 Comprar VIP (Pix)</button>
</div>

</div>

<script>
// ===== DADOS =====
const foods={
  emagrecer:[
    ["🍳 Ovos","🥗 Frango","🌙 Salada"],
    ["🥣 Aveia","🐟 Peixe","🌙 Sopa"],
    ["🍞 Integral","🥗 Atum","🌙 Omelete"]
  ],
  ganhar:[
    ["🥞 Panqueca","🍛 Arroz + frango","🌙 Shake"],
    ["🥣 Aveia + banana","🍝 Macarrão","🌙 Ovos"],
    ["🍞 Pão + ovos","🍖 Carne","🌙 Vitamina"]
  ],
  definir:[
    ["🍳 Ovos + aveia","🥗 Frango","🌙 Salada"],
    ["🥣 Iogurte","🍛 Carne","🌙 Omelete"],
    ["🍞 Integral","🐟 Peixe","🌙 Legumes"]
  ]
};

const workouts={
  emagrecer:[
    ["🚶 Caminhada","🔥 Polichinelo","🧘 Alongar"],
    ["🏃 Corrida","🔥 Burpee","🧘 Prancha"],
    ["🚴 Bike","🔥 Agacho","🧘 Yoga"]
  ],
  ganhar:[
    ["🏋️ Peito","💪 Flexão","🧘 Alongar"],
    ["🏋️ Pernas","💪 Agacho","🧘 Prancha"],
    ["🏋️ Braços","💪 Rosca","🧘 Alongar"]
  ],
  definir:[
    ["🏋️ Corpo todo","🔥 Funcional","🧘 Alongar"],
    ["💪 Abdômen","🔥 HIIT","🧘 Prancha"],
    ["🏋️ Resistência","🔥 Cardio","🧘 Yoga"]
  ]
};

// ===== ESTADO =====
let vip=localStorage.getItem("vip")==="true";
let day=Number(localStorage.getItem("day")||1);
let doneDays=JSON.parse(localStorage.getItem("doneDays")||"[]");
let chart=null;

// ===== FUNÇÕES =====
function unlockVIP(){
  localStorage.setItem("vip","true");
  vip=true;
  alert("🎉 VIP desbloqueado!");
  loadVIP();
}

function loadVIP(){
  const goal=document.getElementById("goal").value;
  if(!vip || !goal) return;

  document.getElementById("vipContent").classList.remove("hidden");
  document.getElementById("unlockBtn").style.display="none";

  document.getElementById("dayCount").innerText=day;
  document.getElementById("bar").style.width=(day/30*100)+"%";

  document.getElementById("food").innerHTML=
    foods[goal][(day-1)%foods[goal].length].join("<br>");
  document.getElementById("workout").innerHTML=
    workouts[goal][(day-1)%workouts[goal].length].join("<br>");

  renderCalendar();
  renderChart();
}

function finishDay(){
  if(doneDays.includes(day)) return;
  doneDays.push(day);
  localStorage.setItem("doneDays",JSON.stringify(doneDays));
  alert("🎉 Parabéns! Volte amanhã.");
  day++;
  if(day>30) day=1;
  localStorage.setItem("day",day);
  loadVIP();
}

function renderCalendar(){
  const cal=document.getElementById("calendar");
  cal.innerHTML="";
  for(let i=1;i<=30;i++){
    const d=document.createElement("div");
    d.className="day";
    d.innerHTML=doneDays.includes(i)?"✔️":i;
    if(doneDays.includes(i)) d.classList.add("done");
    cal.appendChild(d);
  }
}

function renderChart(){
  const ctx=document.getElementById("chart");
  if(chart) chart.destroy();
  chart=new Chart(ctx,{
    type:"bar",
    data:{
      labels:Array.from({length:30},(_,i)=>i+1),
      datasets:[{
        label:"Concluído",
        data:Array.from({length:30},(_,i)=>doneDays.includes(i+1)?1:0),
        backgroundColor:"gold"
      }]
    },
    options:{
      scales:{y:{min:0,max:1,ticks:{stepSize:1}}}
    }
  });
}

document.getElementById("goal").addEventListener("change",loadVIP);
loadVIP();
</script>
</body>
</html>
